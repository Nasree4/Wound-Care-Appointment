<html lang="th">

                height: 148mm !important;

                padding: 0 !important;
                overflow: hidden !important;

        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

            .print-area {

</head>
<body class="bg-slate-100 text-slate-900 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        const WOUND_TYPES = [
            "Laceration (แผลฉีกขาด)", "Abrasion (แผลถลอก)", "I&D (กรีดระบายหนอง)", 
            "Puncture (แผลถูกแทง)", "Avulsion (แผลถูกกระชาก)", "Excision (การตัดเนื้อออก)",
            "Cellulitis", "Amputate", "สัตว์กัด (Animal bite)", "สัตว์ข่วน (Animal scratch)", 
            "Burn", "ถอดเล็บ (Nail extraction)", "แผลเบาหวาน (DM Ulcer)", "แผลผ่าตัด (Surgical wound)", 
            "Debridement", "Aspirate"
        ];
        
        const BODY_LOCATIONS = [
            "Head (ศีรษะ)", "Face (ใบหน้า)", "Eye (ดวงตา)", "Ear (หู)", "Nose (จมูก)", "Mouth (ปาก)", 
            "Neck (คอ)", "Shoulder (ไหล่)", "Chest (หน้าอก)", "Back (หลัง)", "Abdomen (หน้าท้อง)", 
            "Arm (แขน)", "Hand (มือ)", "Finger (นิ้วมือ)", "Leg (ขา)", "Knee (เข่า)", "Foot (เท้า)", "Toe (นิ้วเท้า)",
            "Bottom (ก้น)", "Penis (องคชาต)", "Breast (หน้าอก/เต้านม)", "Vagina (ช่องคลอด)", "Scrotum (ถุงอัณฑะ)"
        ];
        
        const PRIVILEGES = [
            "บัตรทอง (UC)", "ประกันสังคม (SSS)", "พรบ. (Motor Act)", 
            "ข้าราชการ (CSMBS)", "อปท.", "รัฐวิสาหกิจ", "ประกันชีวิต/บริษัท", 
            "เงินสด (Cash)", "อื่นๆ"
        ];

        const DRAFT_KEY = 'woundcare_draft_v2_firebase';
        const FIREBASE_CONFIG_KEY = 'woundcare_firebase_config_v2';

        // Firebase Configuration
        const DEFAULT_FIREBASE_CONFIG = {
            apiKey: "AIzaSyBuhfEu9UO9QFtSELoPuG5V2vbULOCggOM",
            authDomain: "wound-care-appointment.firebaseapp.com",
            databaseURL: "https://wound-care-appointment-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "wound-care-appointment",
            storageBucket: "wound-care-appointment.firebasestorage.app",
            messagingSenderId: "728038304492",
            appId: "1:728038304492:web:9662b3d6bfeab6ed3e13c9",
            measurementId: "G-EMY6R7Q84C"
        };

        const addDays = (dateStr, n) => {
            if (!dateStr || !dateStr.includes('-')) return dateStr;
            const [y, m, d] = dateStr.split('-').map(Number);
            const res = new Date(y, m - 1, d);
            res.setDate(res.getDate() + n);
            return `${res.getFullYear()}-${String(res.getMonth()+1).padStart(2,'0')}-${String(res.getDate()).padStart(2,'0')}`;
        };

        const addMonths = (dateStr, n) => {
            if (!dateStr || !dateStr.includes('-')) return dateStr;
            const [y, m, d] = dateStr.split('-').map(Number);
            
            const targetMonthDate = new Date(y, (m - 1) + n, 1);
            const targetYear = targetMonthDate.getFullYear();
            const targetMonth = targetMonthDate.getMonth();
            
            const maxDaysInTargetMonth = new Date(targetYear, targetMonth + 1, 0).getDate();
            const actualDay = Math.min(d, maxDaysInTargetMonth);
            const finalDate = new Date(targetYear, targetMonth, actualDay);
            
            return `${finalDate.getFullYear()}-${String(finalDate.getMonth()+1).padStart(2,'0')}-${String(finalDate.getDate()).padStart(2,'0')}`;
        };

        const formatThaiDate = (dateStr, opts) => {
            if (!dateStr || typeof dateStr !== 'string' || !dateStr.includes('-')) return '-';
            const parts = dateStr.split('-').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) return '-';
            const [y, m, d] = parts;
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString('th-TH', opts);
        };

        const calculateAge = (birthday) => {
            if (!birthday || birthday === '-' || typeof birthday !== 'string') return '';
            let birthDate;
            
            if (birthday.includes('/')) {
                const parts = birthday.split('/');
                if (parts.length === 3) {
                    let year = parseInt(parts[2], 10);
                    if (year > 2400) year -= 543;
                    birthDate = new Date(year, parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
                }
            } else if (birthday.includes('-')) {
                const parts = birthday.split('-');
                if (parts.length === 3) {
                    let year = parseInt(parts[0], 10);
                    if (year > 2400) year -= 543;
                    birthDate = new Date(year, parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                }
            } else {
                birthDate = new Date(birthday);
            }

            if (!birthDate || isNaN(birthDate.getTime())) return '';

            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age >= 0 ? age : '';
        };

        const validateAppointment = (patient, appt) => {
            const errors = [];
            if (!patient) {
                errors.push('กรุณาระบุข้อมูลหรือค้นหาคนไข้');
                return errors;
            }
            if (!patient.hn || String(patient.hn).trim() === '') errors.push('HN ไม่ถูกต้อง');
            if (!patient.fname || String(patient.fname).trim() === '') errors.push('กรุณากรอกชื่อคนไข้');

            if (appt.weight !== '') {
                const w = parseFloat(appt.weight);
                if (isNaN(w) || w <= 0 || w > 300) errors.push('น้ำหนักต้องอยู่ระหว่าง 1–300 กก.');
            }

            if (appt.stitchCount !== '') {
                const s = parseInt(appt.stitchCount);
                if (isNaN(s) || s < 0 || s > 200) errors.push('จำนวนเข็มต้องอยู่ระหว่าง 0–200');
            }

            if (appt.stitchRemovalDate && appt.stitchRemovalDate <= appt.visitDate) {
                errors.push('วันนัดตัดไหมต้องหลังวันรับบริการ');
            }

            return errors;
        };

        const safeStr = (val) => (val === null || val === undefined) ? '' : String(val);

        const defaultAppointment = {
            visitDate: new Date().toLocaleDateString('en-CA'),
            weight: '', privilege: '', woundType: '', woundLocation: '',
            stitchCount: '', dressingFrequency: 'ทุกวัน', stitchRemovalDate: '',
            note: '',
            staffName: 'เจ้าหน้าที่พยาบาล', calculatedDates: []
        };

        const ValidationErrors = ({ errors, onDismiss }) => {
            if (!errors || errors.length === 0) return null;
            return (
                <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[200] bg-rose-50 border-2 border-rose-400 rounded-3xl shadow-2xl px-6 py-4 max-w-sm w-[90vw] animate-in slide-in-from-top-4">
                    <div className="flex justify-between items-start gap-3">
                        <div>
                            <div className="font-black text-rose-700 text-sm mb-2 uppercase tracking-wide">กรุณาตรวจสอบข้อมูล</div>
                            <ul className="space-y-1">
                                {errors.map((e, i) => (
                                    <li key={i} className="text-rose-600 text-xs font-bold flex items-start gap-1.5">
                                        <span className="mt-0.5">•</span>{e}
                                    </li>
                                ))}
                            </ul>
                        </div>
                        <button onClick={onDismiss} className="text-rose-400 font-black text-lg leading-none hover:text-rose-600 shrink-0">✕</button>
                    </div>
                </div>
            );
        };

        const AppointmentCard = ({ patient, appt }) => {
            const vaccines = appt.calculatedDates ? [...new Set(appt.calculatedDates.map(d => d.category))] : [];
            
            const getCategoryTitle = (cat) => {
                if (cat === 'dT') return 'วัคซีนบาดทะยัก (dT)';
                if (cat === 'PCEC') return 'วัคซีนพิษสุนัขบ้า (Rabies Vaccine)';
                return `ตารางนัดฉีดวัคซีน ${cat}`;
            };

            return (
                <div className="print-area bg-white p-[3.5mm_4mm] text-black border border-slate-300 shadow-2xl print:shadow-none print:border-none print:m-0 print:p-[3.5mm_4mm] overflow-hidden flex flex-col relative font-sans leading-tight mx-auto">
                    
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-[0.18] pointer-events-none watermark">
                        <img src="https://img1.pic.in.th/images/1bf299103031b07d1.png" alt="Watermark" className="w-[68mm] h-auto object-contain logo-bw" onError={(e) => e.target.style.display = 'none'} />
                    </div>

                    <div className="w-full flex justify-between items-center mb-1 relative z-10">
                        <div className="w-7/12 text-left pr-1 space-y-0.5">
                            <h2 className="text-[12px] font-black uppercase leading-none tracking-tighter text-black">ใบนัดรับบริการทางการแพทย์</h2>
                            <div className="text-[7.5px] text-black font-bold uppercase tracking-tight opacity-90">Hospital Appointment Card</div>
                            <div className="text-[7.5px] text-black font-bold leading-none">โรงพยาบาลเจาะไอร้อง จ.นราธิวาส</div>
                        </div>
                        <div className="w-5/12 flex justify-end">
                            <img src="https://img2.pic.in.th/1245bce0a0bc0e53aa53.png" alt="Hospital Logo" className="header-logo max-h-[38px] object-contain mix-blend-multiply logo-bw" onError={(e) => e.target.style.display = 'none'} />
                        </div>
                    </div>

                    <div className="space-y-0.5 mb-1 relative z-10 text-black">
                        <div className="flex justify-between items-end border-b border-dotted border-black pb-0.5 gap-1">
                            <div className="flex items-baseline flex-1 min-w-0">
                                <strong className="text-[10.5px] shrink-0 mr-1 font-bold">ชื่อ-สกุล:</strong> 
                                {patient && patient.fname ? (
                                    <div className="text-[12px] font-black px-0.5 uppercase tracking-tight leading-none flex-1 min-w-0 flex items-baseline">
                                        <span className="truncate">{`${safeStr(patient.pname)}${safeStr(patient.fname)} ${safeStr(patient.lname)}`}</span>
                                        {patient.birthday && calculateAge(patient.birthday) !== '' && (
                                            <span className="ml-1 shrink-0 whitespace-nowrap text-[10px]">อายุ {calculateAge(patient.birthday)} ปี</span>
                                        )}
                                    </div>
                                ) : (
                                    <div className="text-[12px] font-black px-0.5 uppercase tracking-tight leading-none truncate flex-1 min-w-0">
                                        .......................................
                                    </div>
                                )}
                            </div>
                            <div className="text-[10.5px] shrink-0 font-bold whitespace-nowrap">
                                <strong>HN:</strong> <span className="text-[13px] font-black ml-0.5">{patient && patient.hn ? safeStr(patient.hn) : '.......'}</span>
                            </div>
                        </div>
                        
                        <div className="flex justify-between items-end border-b border-dotted border-black pb-0.5 gap-1">
                            <div className="flex items-baseline flex-1 min-w-0">
                                <strong className="text-[10.5px] shrink-0 mr-1 font-bold">สิทธิ:</strong> 
                                <div className="text-[12px] font-black px-0.5 uppercase tracking-tight leading-none truncate">
                                    {appt.privilege ? safeStr(appt.privilege) : '.......................................'}
                                </div>
                            </div>
                            <div className="text-[10.5px] shrink-0 font-bold whitespace-nowrap">
                                <strong>นน.:</strong> <span className="text-[13px] font-black mx-0.5">{appt.weight ? safeStr(appt.weight) : '...'}</span> กก.
                            </div>
                        </div>

                        <div className="flex justify-between pt-0.5 text-[8px] font-medium text-black">
                            <div><strong className="font-bold">วันที่รับบริการ:</strong> {formatThaiDate(appt.visitDate, {day:'numeric', month:'long', year:'numeric'})}</div>
                            <div><strong className="font-bold">เวลาพิมพ์:</strong> {new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.</div>
                        </div>
                    </div>

                    <div className="mb-1 relative z-10">
                        <div className="bg-gray-100 border border-black px-1 py-[1px] flex items-center gap-1 print:bg-transparent">
                            <span className="text-[8.5px] font-black uppercase tracking-widest leading-none text-black">แผนการรักษา (Wound Care)</span>
                        </div>
                        <table className="w-full text-[8.5px] border-collapse border-x border-b border-black">
                            <tbody>
                                <tr className="border-b border-black">
                                    <td className="px-1.5 py-[1.5px] border-r border-black w-1/2 text-black font-bold"><strong>ลักษณะ:</strong> {appt.woundType ? safeStr(appt.woundType.split(' ')[0]) : '-'}</td>
                                    <td className="px-1.5 py-[1.5px] text-black font-bold"><strong>ตำแหน่ง:</strong> {appt.woundLocation ? safeStr(appt.woundLocation) : '-'}</td>
                                </tr>
                                <tr>
                                    <td className="px-1.5 py-[1.5px] border-r border-black font-black text-black"><strong>ทำแผล:</strong> {safeStr(appt.dressingFrequency)}</td>
                                    <td className="px-1.5 py-[1.5px] font-black text-black"><strong>จำนวน:</strong> {appt.stitchCount ? `${appt.stitchCount} เข็ม` : '-'}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    {vaccines.map((cat) => (
                        <div key={cat} className="mb-1 relative z-10">
                            <div className="bg-gray-100 border border-black px-1 py-[1px] flex items-center gap-1 print:bg-transparent">
                                <span className="text-[8.5px] font-black uppercase tracking-widest leading-none text-black">{getCategoryTitle(cat)}</span>
                            </div>
                            <table className="w-full text-[8.5px] border-collapse border-x border-b border-black">
                                <thead>
                                    <tr className="bg-gray-50 border-b border-black font-black text-[7.5px]">
                                        <th className="px-1 py-[1.5px] text-left border-r border-black text-black">รายการ</th>
                                        <th className="px-1 py-[1.5px] text-center border-r border-black w-24 text-black">วันที่นัด</th>
                                        <th className="px-1 py-[1.5px] text-center w-10 text-black italic">ผู้ฉีด</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {appt.calculatedDates.filter(d => d.category === cat).map((item, idx) => (
                                        <tr key={idx} className="border-b border-black last:border-b-0 leading-tight">
                                            <td className="px-1 py-[1.5px] border-r border-black leading-tight">
                                                <div className="font-black text-black text-[8.5px]">{safeStr(item.label)}</div>
                                                <div className="text-[6.5px] text-black font-bold leading-none mt-0.5">{safeStr(item.desc)}</div>
                                            </td>
                                            <td className="px-1 py-[1.5px] border-r border-black font-black text-[9.5px] text-black text-center">
                                                {formatThaiDate(item.date, { day: 'numeric', month: 'short', year: '2-digit' })}
                                            </td>
                                            <td className="px-1 py-[1.5px] text-center text-[7px] text-black font-black italic">
                                                {/* เว้นว่างสำหรับเซ็นชื่อ */}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    ))}

                    {appt.stitchRemovalDate && (
                        <div className="border-[1.5px] border-black p-0.5 text-center rounded-[6px] bg-gray-50 print:bg-transparent mb-1 shadow-sm border-dashed relative z-10">
                            <div className="text-[8.5px] font-black uppercase text-black flex items-center justify-center gap-1 leading-none mb-[1px]">กำหนดนัดตัดไหม (Stitches Off)</div>
                            <div className="text-[13px] font-black text-black underline decoration-double underline-offset-1 tracking-tighter">
                                {formatThaiDate(appt.stitchRemovalDate, { day: 'numeric', month: 'long', year: 'numeric' })}
                            </div>
                        </div>
                    )}

                    {appt.note && (
                        <div className="mb-1 mt-0.5 relative z-10 text-[8.5px] text-black leading-tight border-l-[1.5px] border-black pl-1.5">
                            <strong className="font-black">หมายเหตุ:</strong> {safeStr(appt.note)}
                        </div>
                    )}

                    <div className="mt-auto flex flex-col gap-0.5 relative z-10">
                        <div className="text-center py-0.5">
                            <div className="text-[10px] font-black text-black flex items-center justify-center gap-1 uppercase tracking-[0.01em] leading-none">"เจ็บป่วยฉุกเฉินโทร 1669 ตลอด 24 ชม."</div>
                        </div>
                        <div className="flex justify-between items-end text-[7.5px] pt-0.5 border-t border-black opacity-100 leading-none">
                            <div className="italic font-bold leading-tight space-y-0.5 text-black">
                                <div className="text-black font-black">* กรุณานำใบนัดใบนี้มาด้วยทุกครั้งที่เข้ารับบริการ</div>
                                <div className="text-black font-mono tracking-tighter uppercase text-[6.5px]">CHOAIRONG HOSPITAL | WOUNDCARE-FIREBASE-V1</div>
                            </div>
                            <div className="text-center min-w-[75px] text-black">
                                <div className="font-black uppercase text-[8.5px] border-b-[1px] border-black pb-[1px] mb-[1px]">{safeStr(appt.staffName)}</div>
                                <div className="text-[6.5px] font-black uppercase tracking-widest leading-none">Authorized</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [mode, setMode] = useState('app'); // 'app' | 'list' | 'settings'
            const [searchHn, setSearchHn] = useState('');
            const [selectedPatient, setSelectedPatient] = useState(null);
            const [isManualEntry, setIsManualEntry] = useState(false);
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            const [validationErrors, setValidationErrors] = useState([]);

            // Firebase Config State
            const [firebaseConfig, setFirebaseConfig] = useState(() => {
                try {
                    const saved = localStorage.getItem(FIREBASE_CONFIG_KEY);
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return DEFAULT_FIREBASE_CONFIG;
            });
            const [dbConnected, setDbConnected] = useState(false);
            const [dbRef, setDbRef] = useState(null);

            // Realtime Appointments & Patient History
            const [realtimeRegistry, setRealtimeRegistry] = useState([]);
            const [patientHistory, setPatientHistory] = useState([]);
            const [showHistoryModal, setShowHistoryModal] = useState(false);

            // Filter for Registry page
            const [filterStartDate, setFilterStartDate] = useState(() => new Date().toLocaleDateString('en-CA'));
            const [filterEndDate, setFilterEndDate] = useState(() => new Date().toLocaleDateString('en-CA'));

            // CSV Upload State
            const [csvProgress, setCsvProgress] = useState({ active: false, current: 0, total: 0, percentage: 0 });
            const fileInputRef = useRef(null);

            // Schedules
            const [dtSchedule, setDtSchedule] = useState('none'); 
            const [pcecSchedule, setPcecSchedule] = useState('none');

            // Appointment Draft
            const [appointment, setAppointment] = useState(() => {
                try {
                    const saved = localStorage.getItem(DRAFT_KEY);
                    if (saved) return { ...defaultAppointment, ...JSON.parse(saved) };
                } catch (e) { console.error(e); }
                return defaultAppointment;
            });

            // Initialize Firebase App
            useEffect(() => {
                try {
                    if (!firebase.apps.length) {
                        if (firebaseConfig && (firebaseConfig.databaseURL || firebaseConfig.projectId)) {
                            firebase.initializeApp(firebaseConfig);
                        }
                    } else {
                        // Re-initialize if config changed
                        const currentApp = firebase.app();
                        if (currentApp.options.databaseURL !== firebaseConfig.databaseURL) {
                            currentApp.delete().then(() => {
                                firebase.initializeApp(firebaseConfig);
                            });
                        }
                    }

                    const db = firebase.database();
                    setDbRef(db);

                    // Connection State Monitor
                    const connectedRef = db.ref('.info/connected');
                    connectedRef.on('value', (snap) => {
                        setDbConnected(snap.val() === true);
                    });

                    // Listen to /registry in real-time
                    const registryRef = db.ref('registry');
                    registryRef.on('value', (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            const list = Object.keys(val).map(key => ({
                                id: key,
                                ...val[key]
                            }));
                            setRealtimeRegistry(list);
                        } else {
                            setRealtimeRegistry([]);
                        }
                    }, (err) => {
                        console.warn("Registry listener error:", err.message);
                    });

                    return () => {
                        connectedRef.off();
                        registryRef.off();
                    };
                } catch (err) {
                    console.error("Firebase init error:", err);
                    setDbConnected(false);
                }
            }, [firebaseConfig]);

            // Save Draft to LocalStorage
            useEffect(() => {
                try {
                    const { calculatedDates, ...rest } = appointment;
                    localStorage.setItem(DRAFT_KEY, JSON.stringify(rest));
                } catch (e) {}
            }, [appointment]);

            useEffect(() => {
                try {
                    const savedPatient = localStorage.getItem(DRAFT_KEY + '_patient');
                    if (savedPatient) {
                        const { patient: p, wasManual } = JSON.parse(savedPatient);
                        setSelectedPatient(p);
                        setIsManualEntry(wasManual === true);
                    }
                } catch (e) {}
            }, []);

            useEffect(() => {
                try {
                    if (selectedPatient) {
                        localStorage.setItem(DRAFT_KEY + '_patient', JSON.stringify({
                            patient: selectedPatient,
                            wasManual: isManualEntry 
                        }));
                        loadPatientHistory(selectedPatient.hn);
                    } else {
                        setPatientHistory([]);
                    }
                } catch (e) {}
            }, [selectedPatient, isManualEntry]);

            const showNotification = (msg, type = 'success') => {
                setToast({ show: true, message: msg, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3500);
            };

            const clearDraft = () => {
                try {
                    localStorage.removeItem(DRAFT_KEY);
                    localStorage.removeItem(DRAFT_KEY + '_patient');
                } catch (e) {}
            };

            // Load Patient Appointment History from Firebase
            const loadPatientHistory = async (hn) => {
                if (!hn || !dbRef) return;
                try {
                    const snap = await dbRef.ref('appointments')
                        .orderByChild('patientHn')
                        .equalTo(String(hn))
                        .once('value');
                    
                    const data = snap.val();
                    if (data) {
                        const historyList = Object.keys(data).map(k => ({
                            id: k,
                            ...data[k]
                        })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                        setPatientHistory(historyList);
                    } else {
                        setPatientHistory([]);
                    }
                } catch (e) {
                    console.error("Load history error:", e);
                }
            };

            const toggleManualEntry = () => {
                const nextManualState = !isManualEntry;
                setIsManualEntry(nextManualState);
                setSelectedPatient(nextManualState ? { hn: searchHn, pname: '', fname: '', lname: '', privilege: '', cid: '', birthday: '' } : null);
            };

            // Vaccine Calculation Engine
            useEffect(() => {
                let dates = [];
                const start = appointment.visitDate;
                if (!start) return;
                
                if (pcecSchedule === 'PCEC_IM_Essen') {
                    [0, 3, 7, 14, 28].forEach((d, i) => dates.push({ label: `SPEEDA #${i + 1} (D${d})`, date: addDays(start, d), desc: 'IM (0.5 ml) แขน 1 ข้าง', status: d === 0 ? 'ฉีดแล้ว' : 'นัดหมาย', category: 'PCEC' }));
                } else if (pcecSchedule === 'PCEC_ID_TRC') {
                    [0, 3, 7, 28].forEach((d, i) => dates.push({ label: `SPEEDA #${i + 1} (D${d})`, date: addDays(start, d), desc: 'ID (0.1 ml) 2 ข้างพร้อมกัน', status: d === 0 ? 'ฉีดแล้ว' : 'นัดหมาย', category: 'PCEC' }));
                } else if (pcecSchedule === 'PCEC_booster_lt_6m_IM') {
                    dates.push({ label: 'SPEEDA Booster (D0)', date: start, desc: 'IM (0.5 ml) แขน 1 ข้าง', status: 'ฉีดแล้ว', category: 'PCEC' });
                } else if (pcecSchedule === 'PCEC_booster_lt_6m_ID') {
                    dates.push({ label: 'SPEEDA Booster (D0)', date: start, desc: 'ID (0.1 ml) 1 จุด', status: 'ฉีดแล้ว', category: 'PCEC' });
                } else if (pcecSchedule === 'PCEC_booster_gt_6m_IM') {
                    [0, 3].forEach((d, i) => dates.push({ label: `SPEEDA Booster #${i + 1} (D${d})`, date: addDays(start, d), desc: 'IM (0.5 ml) แขน 1 ข้าง', status: d === 0 ? 'ฉีดแล้ว' : 'นัดหมาย', category: 'PCEC' }));
                } else if (pcecSchedule === 'PCEC_booster_gt_6m_ID') {
                    [0, 3].forEach((d, i) => dates.push({ label: `SPEEDA Booster #${i + 1} (D${d})`, date: addDays(start, d), desc: 'ID (0.1 ml) 1 จุด', status: d === 0 ? 'ฉีดแล้ว' : 'นัดหมาย', category: 'PCEC' }));
                }

                if (dtSchedule === 'dT_new') {
                    const dose1Date = start;
                    const dose2Date = addMonths(dose1Date, 1);
                    const dose3Date = addMonths(dose2Date, 6);
                    
                    dates.push(
                        { label: 'dT เข็ม 1', date: dose1Date, desc: 'IM (0.5 ml)', status: 'ฉีดแล้ว', category: 'dT' },
                        { label: 'dT เข็ม 2 (+1ด)', date: dose2Date, desc: 'IM (0.5 ml)', status: 'นัดหมาย', category: 'dT' },
                        { label: 'dT เข็ม 3 (+6ด)', date: dose3Date, desc: 'IM (0.5 ml)', status: 'นัดหมาย', category: 'dT' }
                    );
                } else if (dtSchedule === 'dT_booster') {
                    dates.push({ label: 'dT (กระตุ้น)', date: start, desc: 'IM (0.5 ml) เข้ากล้ามเนื้อ', status: 'ฉีดแล้ว', category: 'dT' });
                }
                setAppointment(prev => ({ ...prev, calculatedDates: dates }));
            }, [appointment.visitDate, pcecSchedule, dtSchedule]);

            // Search Patient in Firebase Realtime Database
            const handleSearch = async () => {
                const trimmedHn = String(searchHn).trim();
                if (!trimmedHn) return;
                setLoading(true);

                try {
                    if (!dbRef) throw new Error("ฐานข้อมูล Firebase ยังไม่พร้อมใช้งาน");
                    
                    const snapshot = await dbRef.ref(`patients/${trimmedHn}`).once('value');
                    const found = snapshot.val();

                    if (found) {
                        setSelectedPatient(found);
                        setIsManualEntry(false);
                        loadPatientHistory(found.hn);
                        showNotification(`พบข้อมูลคนไข้: ${found.pname || ''}${found.fname} ${found.lname}`, "success");
                    } else {
                        showNotification(`ไม่พบ HN ${trimmedHn} ใน Firebase (สามารถกดกรอกข้อมูลเองได้)`, "error");
                    }
                } catch (err) {
                    console.error("Search error:", err);
                    showNotification(`ค้นหาไม่สำเร็จ: ${err.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            // Save Appointment to Firebase Realtime Database
            const handleSave = async () => {
                const errors = validateAppointment(selectedPatient, appointment);
                if (errors.length > 0) {
                    setValidationErrors(errors);
                    return;
                }

                setLoading(true);
                try {
                    if (!dbRef) throw new Error("ไม่ได้เชื่อมต่อ Firebase Realtime Database");

                    const newApptKey = dbRef.ref('appointments').push().key;
                    const timestamp = Date.now();

                    const appointmentData = {
                        id: newApptKey,
                        visitDate: appointment.visitDate,
                        patientHn: String(selectedPatient.hn),
                        patientName: `${selectedPatient.pname || ''}${selectedPatient.fname} ${selectedPatient.lname}`,
                        patientInfo: selectedPatient,
                        weight: appointment.weight,
                        privilege: appointment.privilege,
                        woundType: appointment.woundType,
                        woundLocation: appointment.woundLocation,
                        stitchCount: appointment.stitchCount,
                        dressingFrequency: appointment.dressingFrequency,
                        stitchRemovalDate: appointment.stitchRemovalDate,
                        calculatedDates: appointment.calculatedDates || [],
                        note: appointment.note,
                        staffName: appointment.staffName,
                        createdAt: timestamp,
                        createdAtFormatted: new Date().toLocaleString('th-TH')
                    };

                    const updates = {};
                    // 1. บันทึกลง /appointments/{newApptKey}
                    updates[`/appointments/${newApptKey}`] = appointmentData;

                    // 2. ถ้าคนไข้ถูกกรอกใหม่หรือยังไม่มีใน /patients ให้อัปเดตข้อมูลคนไข้
                    updates[`/patients/${String(selectedPatient.hn)}`] = {
                        hn: String(selectedPatient.hn),
                        pname: selectedPatient.pname || '',
                        fname: selectedPatient.fname || '',
                        lname: selectedPatient.lname || '',
                        cid: selectedPatient.cid || '',
                        birthday: selectedPatient.birthday || '-'
                    };

                    // 3. แตกรายการนัดหมายในอนาคตลง /registry
                    if (appointment.stitchRemovalDate) {
                        const regKey = dbRef.ref('registry').push().key;
                        updates[`/registry/${regKey}`] = {
                            id: regKey,
                            appointmentId: newApptKey,
                            hn: String(selectedPatient.hn),
                            name: `${selectedPatient.pname || ''}${selectedPatient.fname} ${selectedPatient.lname}`,
                            date: appointment.stitchRemovalDate,
                            type: 'ตัดไหม (Suture Removal)',
                            status: 'pending',
                            createdAt: timestamp
                        };
                    }

                    if (appointment.calculatedDates) {
                        appointment.calculatedDates.forEach(d => {
                            if (d.status === 'นัดหมาย') {
                                const regKey = dbRef.ref('registry').push().key;
                                updates[`/registry/${regKey}`] = {
                                    id: regKey,
                                    appointmentId: newApptKey,
                                    hn: String(selectedPatient.hn),
                                    name: `${selectedPatient.pname || ''}${selectedPatient.fname} ${selectedPatient.lname}`,
                                    date: d.date,
                                    type: `ฉีดวัคซีน: ${d.label}`,
                                    status: 'pending',
                                    createdAt: timestamp
                                };
                            }
                        });
                    }

                    // Execute Multi-path Real-time Update
                    await dbRef.ref().update(updates);

                    showNotification("บันทึกลง Firebase Realtime Database สำเร็จ ✓", "success");
                    loadPatientHistory(selectedPatient.hn);
                    clearDraft();

                } catch (err) {
                    console.error('Save error:', err);
                    showNotification(`บันทึกไม่สำเร็จ: ${err.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handlePrint = () => {
                const errors = validateAppointment(selectedPatient, appointment);
                if (errors.length > 0) {
                    setValidationErrors(errors);
                    return;
                }
                window.print();
            };

            const handleClearDraft = () => {
                clearDraft();
                setSelectedPatient(null);
                setIsManualEntry(false);
                setSearchHn('');
                setDtSchedule('none');
                setPcecSchedule('none');
                setAppointment(defaultAppointment);
                setPatientHistory([]);
                showNotification("ล้างข้อมูลเรียบร้อย พร้อมเริ่มรายการใหม่", "success");
            };

            const restoreHistoryToForm = (log) => {
                if (log.patientInfo) {
                    setSelectedPatient(log.patientInfo);
                }
                setAppointment({
                    visitDate: log.visitDate || new Date().toLocaleDateString('en-CA'),
                    weight: log.weight || '',
                    privilege: log.privilege || '',
                    woundType: log.woundType || '',
                    woundLocation: log.woundLocation || '',
                    stitchCount: log.stitchCount || '',
                    dressingFrequency: log.dressingFrequency || 'ทุกวัน',
                    stitchRemovalDate: log.stitchRemovalDate || '',
                    note: log.note || '',
                    staffName: log.staffName || 'เจ้าหน้าที่พยาบาล',
                    calculatedDates: log.calculatedDates || []
                });
                setShowHistoryModal(false);
                showNotification(`โหลดข้อมูลใบนัดวันที่ ${formatThaiDate(log.visitDate)} เรียบร้อย`, "success");
            };

            // Delete item from Registry
            const handleDeleteRegistryItem = async (id) => {
                if (!dbRef || !id) return;
                try {
                    await dbRef.ref(`registry/${id}`).remove();
                    showNotification("ลบรายการนัดหมายเรียบร้อย", "success");
                } catch (e) {
                    showNotification("ลบไม่สำเร็จ: " + e.message, "error");
                }
            };

            // Batch CSV Import Handler
            const handleCsvUpload = (event) => {
                const file = event.target.files[0];
                if (!file || !dbRef) return;

                setCsvProgress({ active: true, current: 0, total: 0, percentage: 0 });

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: async (results) => {
                        const rows = results.data;
                        const total = rows.length;
                        const batchSize = 500;
                        let processed = 0;

                        try {
                            for (let i = 0; i < total; i += batchSize) {
                                const chunk = rows.slice(i, i + batchSize);
                                const updates = {};
                                
                                chunk.forEach(row => {
                                    const hn = String(row.hn || row.HN || '').trim();
                                    if (hn) {
                                        updates[`/patients/${hn}`] = {
                                            hn: hn,
                                            pname: row.pname || '',
                                            fname: row.fname || '',
                                            lname: row.lname || '',
                                            cid: row.cid || '',
                                            birthday: row.birthday || '-'
                                        };
                                    }
                                });

                                await dbRef.ref().update(updates);
                                processed += chunk.length;
                                const pct = Math.min(100, Math.round((processed / total) * 100));
                                setCsvProgress({ active: true, current: processed, total, percentage: pct });
                            }

                            showNotification(`นำเข้าข้อมูลผู้ป่วยสำเร็จ ${processed} รายการ`, "success");
                        } catch (err) {
                            console.error("CSV Import error:", err);
                            showNotification(`การนำเข้าข้อมูลล้มเหลว: ${err.message}`, "error");
                        } finally {
                            setTimeout(() => {
                                setCsvProgress({ active: false, current: 0, total: 0, percentage: 0 });
                                if (fileInputRef.current) fileInputRef.current.value = '';
                            }, 1500);
                        }
                    },
                    error: (error) => {
                        showNotification(`อ่านไฟล์ CSV ไม่สำเร็จ: ${error.message}`, "error");
                        setCsvProgress({ active: false, current: 0, total: 0, percentage: 0 });
                    }
                });
            };

            const handleSaveFirebaseConfig = () => {
                try {
                    localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(firebaseConfig));
                    showNotification("บันทึกการตั้งค่า Firebase เรียบร้อย กำลังเชื่อมต่อใหม่...", "success");
                    setMode('app');
                } catch (e) {
                    showNotification("บันทึกไม่สำเร็จ", "error");
                }
            };

            return (
                <div className="min-h-screen relative pb-12">
                    <ValidationErrors errors={validationErrors} onDismiss={() => setValidationErrors([])} />

                    {/* Toast Notification */}
                    {toast.show && (
                        <div className={`fixed bottom-8 left-1/2 -translate-x-1/2 z-[200] flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl animate-bounce ${toast.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}`}>
                            <span className="font-bold text-base">{toast.message}</span>
                            <button onClick={() => setToast({ ...toast, show: false })} className="ml-2 font-black">✕</button>
                        </div>
                    )}

                    {/* Loading Overlay */}
                    {loading && (
                        <div className="fixed inset-0 z-[150] bg-black/20 backdrop-blur-sm flex items-center justify-center">
                            <div className="bg-white rounded-3xl px-8 py-6 shadow-2xl flex items-center gap-4">
                                <div className="w-6 h-6 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"></div>
                                <span className="font-black text-slate-700">กำลังดำเนินการเชื่อมต่อ Firebase...</span>
                            </div>
                        </div>
                    )}

                    {/* Modal แสดงประวัติการนัดย้อนหลัง */}
                    {showHistoryModal && (
                        <div className="fixed inset-0 z-[180] bg-black/40 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <div>
                                        <h3 className="font-black text-slate-800 text-base flex items-center gap-2">
                                            <span>📜</span> ประวัติการรับบริการย้อนหลัง (Firebase)
                                        </h3>
                                        <div className="text-xs font-bold text-slate-500 mt-0.5">
                                            HN: <span className="text-emerald-600 font-black">{selectedPatient?.hn}</span> - {selectedPatient?.pname}{selectedPatient?.fname} {selectedPatient?.lname}
                                        </div>
                                    </div>
                                    <button onClick={() => setShowHistoryModal(false)} className="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 flex items-center justify-center font-black text-slate-600 transition">✕</button>
                                </div>
                                
                                <div className="p-5 overflow-y-auto space-y-3 custom-scrollbar flex-1">
                                    {patientHistory.length === 0 ? (
                                        <div className="py-12 text-center text-slate-400 font-bold">
                                            ไม่พบประวัติการทำใบนัดย้อนหลังของคนไข้รายนี้ใน Firebase
                                        </div>
                                    ) : (
                                        patientHistory.map((item, idx) => (
                                            <div key={item.id || idx} className="p-4 border border-slate-200 rounded-2xl bg-slate-50/50 hover:bg-slate-50 transition flex flex-col md:flex-row justify-between gap-3 items-start md:items-center">
                                                <div className="space-y-1">
                                                    <div className="flex items-center gap-2">
                                                        <span className="bg-emerald-100 text-emerald-800 text-[11px] font-black px-2.5 py-0.5 rounded-lg">
                                                            วันที่รับบริการ: {formatThaiDate(item.visitDate, { day: 'numeric', month: 'short', year: 'numeric' })}
                                                        </span>
                                                        <span className="text-[10px] text-slate-400 font-bold">
                                                            (บันทึกเมื่อ: {item.createdAtFormatted || new Date(item.createdAt).toLocaleDateString('th-TH')})
                                                        </span>
                                                    </div>
                                                    <div className="text-xs text-slate-700 font-bold space-x-2">
                                                        <span><strong>แผล:</strong> {item.woundType || '-'}</span>
                                                        <span>•</span>
                                                        <span><strong>ตำแหน่ง:</strong> {item.woundLocation || '-'}</span>
                                                        <span>•</span>
                                                        <span><strong>ทำแผล:</strong> {item.dressingFrequency}</span>
                                                    </div>
                                                    {item.stitchRemovalDate && (
                                                        <div className="text-xs text-blue-600 font-bold">
                                                            ✂️ กำหนดตัดไหม: {formatThaiDate(item.stitchRemovalDate)}
                                                        </div>
                                                    )}
                                                </div>
                                                <button 
                                                    onClick={() => restoreHistoryToForm(item)} 
                                                    className="shrink-0 bg-slate-900 hover:bg-emerald-600 text-white text-xs font-black px-4 py-2 rounded-xl transition active:scale-95 shadow-sm"
                                                >
                                                    ดึงข้อมูล/พิมพ์อีกครั้ง 🖨️
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <div className="p-4 bg-slate-50 border-t border-slate-100 text-right">
                                    <button onClick={() => setShowHistoryModal(false)} className="px-5 py-2 bg-slate-200 hover:bg-slate-300 font-black text-xs rounded-xl text-slate-700">ปิดหน้าต่าง</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="p-2 md:p-6 max-w-7xl mx-auto">
                        {/* Header Bar */}
                        <header className="print:hidden mb-4 flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-3xl shadow-sm border border-slate-200 gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-600 p-2.5 rounded-2xl text-white shadow-lg font-black uppercase tracking-widest flex items-center justify-center w-10 h-10">
                                    W
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-xl font-black text-slate-800 leading-none tracking-tight">ใบนัดรับบริการทางการแพทย์</h1>
                                        <span className={`px-2 py-0.5 rounded-full text-[9px] font-black uppercase flex items-center gap-1 ${dbConnected ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                            <span className={`w-1.5 h-1.5 rounded-full ${dbConnected ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`}></span>
                                            {dbConnected ? 'Firebase Live' : 'Offline / Check Config'}
                                        </span>
                                    </div>
                                    <div className="text-[11px] text-slate-500 font-bold uppercase mt-1 tracking-wider">Hospital Appointment Card (Firebase Edition)</div>
                                </div>
                            </div>
                            <div className="flex flex-wrap md:flex-nowrap gap-2 w-full md:w-auto">
                                <button onClick={() => setMode(mode === 'list' ? 'app' : 'list')} className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2.5 rounded-2xl font-black transition active:scale-95 border uppercase text-xs ${mode === 'list' ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-blue-50 text-blue-600 hover:bg-blue-100 border-blue-200'}`}>
                                    📅 รายชื่อนัด ({realtimeRegistry.length})
                                </button>
                                <button onClick={handleClearDraft} className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-rose-50 text-rose-500 px-4 py-2.5 rounded-2xl font-black hover:bg-rose-100 transition active:scale-95 border border-rose-200 uppercase text-xs">

                                        </button>
                                    </>

                                <div className="bg-white p-6 md:p-8 rounded-[2rem] border border-slate-200 shadow-sm">
                                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4">
                                        <div>
                                            <h2 className="text-lg font-black text-slate-800 uppercase tracking-wide flex items-center gap-2">
                                                <span className="text-2xl">📅</span> รายชื่อผู้ป่วยนัดหมาย (Real-time Sync)
                                            </h2>
                                            <div className="text-xs text-slate-500 font-bold mt-0.5">
                                                ซิงก์ข้อมูลอัตโนมัติจาก Firebase Realtime Database ข้ามทุกเครื่องในเครือข่าย
                                            </div>
                                        </div>
                                        
                                        {/* ตัวกรองช่วงวันที่ */}
                                        <div className="flex flex-wrap items-center gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200 w-full lg:w-auto">

                                            <div className="flex items-center gap-1.5 flex-1 sm:flex-none">
                                                <label className="text-[11px] font-black text-slate-500 uppercase shrink-0">ถึง</label>
                                                <input type="date" className="p-2 rounded-xl border border-slate-200 text-xs font-black outline-none bg-white focus:ring-2 focus:ring-blue-100" value={filterEndDate} onChange={e => setFilterEndDate(e.target.value)} />

                                            {/* ปุ่มเลือกด่วน */}
                                            <div className="flex items-center gap-1 w-full sm:w-auto mt-1 sm:mt-0">
                                                <button onClick={() => {
                                                    const today = new Date().toLocaleDateString('en-CA');
                                                    setFilterStartDate(today);
                                                    setFilterEndDate(today);
                                                }} className="flex-1 sm:flex-none px-2.5 py-2 bg-white border border-slate-200 rounded-xl text-[11px] font-black hover:bg-slate-100 transition active:scale-95 text-slate-600">วันนี้</button>
                                                
                                                <button onClick={() => {
                                                    const today = new Date().toLocaleDateString('en-CA');
                                                    setFilterStartDate(today);
                                                    setFilterEndDate(addDays(today, 7));
                                                }} className="flex-1 sm:flex-none px-2.5 py-2 bg-white border border-slate-200 rounded-xl text-[11px] font-black hover:bg-slate-100 transition active:scale-95 text-slate-600">+7 วัน</button>
                                                
                                                <button onClick={() => {
                                                    const today = new Date().toLocaleDateString('en-CA');
                                                    setFilterStartDate(today);
                                                    setFilterEndDate(addDays(today, 30));
                                                }} className="flex-1 sm:flex-none px-2.5 py-2 bg-white border border-slate-200 rounded-xl text-[11px] font-black hover:bg-slate-100 transition active:scale-95 text-slate-600">+30 วัน</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="text-xs text-slate-500 uppercase bg-slate-50">
                                                <tr>
                                                    <th className="px-4 py-3 font-black rounded-tl-2xl">ลำดับ</th>
                                                    <th className="px-4 py-3 font-black">วันที่นัด</th>
                                                    <th className="px-4 py-3 font-black">HN</th>
                                                    <th className="px-4 py-3 font-black">ชื่อ-สกุล</th>
                                                    <th className="px-4 py-3 font-black">ประเภทการนัด</th>
                                                    <th className="px-4 py-3 font-black text-center rounded-tr-2xl">จัดการ</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {realtimeRegistry.filter(a => a.date >= filterStartDate && a.date <= filterEndDate).length === 0 ? (
                                                    <tr>
                                                        <td colSpan="6" className="px-4 py-12 text-center">
                                                            <div className="text-slate-400 font-bold text-base mb-1">ไม่มีรายชื่อผู้ป่วยที่นัดในช่วงเวลานี้</div>
                                                            <div className="text-slate-300 text-xs font-medium">
                                                                ({filterStartDate === filterEndDate ? formatThaiDate(filterStartDate, {day:'numeric', month:'long', year:'numeric'}) : `${formatThaiDate(filterStartDate, {day:'numeric', month:'short', year:'numeric'})} - ${formatThaiDate(filterEndDate, {day:'numeric', month:'short', year:'numeric'})}`})
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ) : (
                                                    realtimeRegistry
                                                        .filter(a => a.date >= filterStartDate && a.date <= filterEndDate)
                                                        .sort((a, b) => a.date.localeCompare(b.date))
                                                        .map((appt, idx) => (
                                                            <tr key={appt.id || idx} className="border-b border-slate-100 hover:bg-slate-50/50">
                                                                <td className="px-4 py-3 font-bold text-slate-500">{idx + 1}</td>
                                                                <td className="px-4 py-3 font-black text-slate-700 whitespace-nowrap">{formatThaiDate(appt.date, { day: 'numeric', month: 'short', year: '2-digit' })}</td>
                                                                <td className="px-4 py-3 font-black text-emerald-600">{appt.hn}</td>
                                                                <td className="px-4 py-3 font-bold">{appt.name}</td>
                                                                <td className="px-4 py-3 font-bold">
                                                                    <span className={`px-2.5 py-1 rounded-lg text-[10px] uppercase tracking-wider ${appt.type.includes('ตัดไหม') ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>
                                                                        {appt.type}
                                                                    </span>
                                                                </td>
                                                                <td className="px-4 py-3 text-center">
                                                                    <button onClick={() => handleDeleteRegistryItem(appt.id)} className="text-rose-400 hover:text-rose-600 font-black text-xs px-2.5 py-1 bg-rose-50 hover:bg-rose-100 rounded-lg transition active:scale-95">ลบ</button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        ) : mode === 'settings' ? (

                                    <div className="absolute top-0 left-0 w-full h-2 bg-emerald-600"></div>
                                    <div className="flex justify-between items-center">
                                        <h1 className="text-xl font-black text-slate-800 uppercase tracking-wider flex items-center gap-2">
                                            <span>🔥</span> Firebase Configuration & Tools
                                        </h1>
                                        <span className={`px-3 py-1 rounded-full text-xs font-black uppercase ${dbConnected ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>

                                    </div>

                                    <div className="bg-emerald-50/60 border border-emerald-200 p-5 rounded-3xl space-y-3">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-black text-emerald-900 text-sm flex items-center gap-2">
                                                    <span>📥</span> นำเข้าฐานข้อมูลคนไข้ (CSV Importer)
                                                </h3>
                                                <p className="text-xs font-bold text-emerald-700 mt-1">
                                                    อัปโหลดไฟล์ `รายชื่อ - patients.csv` เพื่อบันทึกรายชื่อคนไข้ทั้งหมดลงใน Firebase `/patients`
                                                </p>
                                            </div>
                                        </div>

                                        <div className="flex flex-col sm:flex-row gap-3 items-center">
                                            <input 
                                                type="file" 
                                                accept=".csv" 
                                                ref={fileInputRef} 
                                                onChange={handleCsvUpload} 
                                                disabled={csvProgress.active}
                                                className="block w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer"
                                            />
                                        </div>

                                        {csvProgress.active && (
                                            <div className="space-y-1.5 pt-2">
                                                <div className="flex justify-between text-xs font-black text-emerald-800">
                                                    <span>กำลังนำเข้าข้อมูล... ({csvProgress.current} / {csvProgress.total})</span>
                                                    <span>{csvProgress.percentage}%</span>
                                                </div>
                                                <div className="w-full bg-emerald-200 rounded-full h-2.5 overflow-hidden">
                                                    <div className="bg-emerald-600 h-2.5 rounded-full transition-all duration-300" style={{ width: `${csvProgress.percentage}%` }}></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Firebase Config Fields */}
                                    <div className="space-y-4 pt-2">
                                        <h3 className="font-black text-slate-800 text-sm uppercase tracking-wider">ตั้งค่าการเชื่อมต่อ Realtime Database</h3>
                                        
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase ml-3">Database URL (จำเป็นต้องมี)</label>
                                            <input className="w-full p-3.5 rounded-2xl border border-slate-200 font-mono text-xs focus:ring-4 focus:ring-emerald-500/10 outline-none" value={firebaseConfig.databaseURL || ''} onChange={e => setFirebaseConfig({...firebaseConfig, databaseURL: e.target.value})} placeholder="https://your-project-default-rtdb.firebaseio.com" />
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black text-slate-400 uppercase ml-3">Project ID</label>
                                                <input className="w-full p-3.5 rounded-2xl border border-slate-200 font-mono text-xs focus:ring-4 focus:ring-emerald-500/10 outline-none" value={firebaseConfig.projectId || ''} onChange={e => setFirebaseConfig({...firebaseConfig, projectId: e.target.value})} placeholder="woundcare-appointment" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black text-slate-400 uppercase ml-3">API Key</label>
                                                <input className="w-full p-3.5 rounded-2xl border border-slate-200 font-mono text-xs focus:ring-4 focus:ring-emerald-500/10 outline-none" value={firebaseConfig.apiKey || ''} onChange={e => setFirebaseConfig({...firebaseConfig, apiKey: e.target.value})} placeholder="AIzaSy..." />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black text-slate-400 uppercase ml-3">Auth Domain</label>
                                                <input className="w-full p-3.5 rounded-2xl border border-slate-200 font-mono text-xs focus:ring-4 focus:ring-emerald-500/10 outline-none" value={firebaseConfig.authDomain || ''} onChange={e => setFirebaseConfig({...firebaseConfig, authDomain: e.target.value})} placeholder="project.firebaseapp.com" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black text-slate-400 uppercase ml-3">App ID</label>
                                                <input className="w-full p-3.5 rounded-2xl border border-slate-200 font-mono text-xs focus:ring-4 focus:ring-emerald-500/10 outline-none" value={firebaseConfig.appId || ''} onChange={e => setFirebaseConfig({...firebaseConfig, appId: e.target.value})} placeholder="1:12345:web:6789" />
                                            </div>
                                        </div>

                                        <div className="flex gap-3 pt-2">
                                            <button onClick={handleSaveFirebaseConfig} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-2xl font-black shadow-lg uppercase active:scale-95 transition-all text-xs tracking-wider">
                                                💾 บันทึกการตั้งค่า Firebase
                                            </button>
                                            <button onClick={() => setMode('app')} className="px-6 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3.5 rounded-2xl font-black uppercase active:scale-95 transition-all text-xs tracking-wider">
                                                กลับสู่หน้าหลัก
                                            </button>
                                        </div>
                                    </div>

                                    {/* Security Rules Helper */}
                                    <div className="bg-slate-50 p-4 rounded-3xl border border-slate-200 text-xs space-y-2">
                                        <div className="font-black text-slate-700 flex items-center justify-between">
                                            <span>🛡️ ตัวอย่าง Firebase Security Rules (database.rules.json):</span>
                                        </div>
                                        <pre className="bg-slate-900 text-emerald-400 p-3 rounded-2xl font-mono text-[11px] overflow-x-auto">
{`{
  "rules": {
    ".read": true,
    ".write": true,
    "appointments": {
      ".indexOn": ["patientHn", "visitDate"]
    },
    "registry": {
      ".indexOn": ["date", "hn"]
    }
  }
}`}
                                        </pre>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* MODE: ฟอร์มสร้างใบนัดและพิมพ์ (Main Form) */
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                <div className="lg:col-span-5 space-y-4 pb-20 print:hidden">
                                    
                                    {(selectedPatient || appointment.woundType || appointment.privilege || appointment.weight) && (
                                        <div className="bg-amber-50 border border-amber-200 rounded-2xl px-4 py-2 flex items-center justify-between">
                                            <div className="flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse inline-block"></span>
                                                <span className="text-xs font-black text-amber-700">บันทึก Draft อัตโนมัติในเครื่องแล้ว</span>
                                            </div>
                                            {selectedPatient && (
                                                <button 
                                                    onClick={() => setShowHistoryModal(true)}
                                                    className="bg-amber-200 hover:bg-amber-300 text-amber-900 text-[10px] font-black px-2.5 py-1 rounded-xl transition active:scale-95 flex items-center gap-1"
                                                >
                                                    📜 ประวัติเก่า ({patientHistory.length})
                                                </button>
                                            )}
                                        </div>
                                    )}

                                    {/* Patient Info Card */}
                                    <div className="bg-white p-5 rounded-[2.5rem] border border-slate-200 shadow-sm transition-all hover:shadow-md">
                                        <div className="flex justify-between items-center mb-4 px-2">
                                            <h2 className="text-xs flex items-center gap-2 text-emerald-700 uppercase tracking-widest font-black">PATIENT INFO</h2>
                                            <button onClick={toggleManualEntry} className="text-[10px] bg-slate-50 px-3 py-1.5 rounded-xl hover:bg-emerald-600 hover:text-white transition-all text-slate-700 font-black border active:scale-95 shadow-sm uppercase">
                                                {isManualEntry ? 'เปลี่ยนไปใช้ช่องค้นหา' : 'กรอกข้อมูลเอง (Manual)'}
                                            </button>
                                        </div>
                                        
                                        {!isManualEntry ? (
                                            <div className="flex gap-2 mb-4">
                                                <input type="text" placeholder="ระบุ HN เพื่อค้นหาใน Firebase..." className="flex-1 p-3.5 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-100 outline-none text-sm font-black bg-slate-50 transition-all placeholder:text-slate-400" value={searchHn} onChange={e => setSearchHn(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleSearch()} />
                                                <button onClick={handleSearch} disabled={loading} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 rounded-2xl transition active:scale-95 shadow-lg shadow-emerald-100 disabled:bg-slate-300 font-black uppercase tracking-tighter">SEARCH</button>
                                            </div>
                                        ) : (
                                            <div className="space-y-2.5 mb-4 animate-in fade-in duration-300 bg-slate-50 p-4 rounded-3xl border border-slate-100">
                                                <input type="text" placeholder="HN" className="w-full p-3 rounded-2xl border border-slate-200 text-sm font-black bg-white outline-none focus:ring-2 focus:ring-emerald-100" value={selectedPatient?.hn || ''} onChange={e => setSelectedPatient({...selectedPatient, hn: e.target.value})} />
                                                <div className="grid grid-cols-3 gap-2">
                                                    <input type="text" placeholder="คำนำหน้า" className="p-3 rounded-2xl border border-slate-200 text-sm bg-white font-bold outline-none focus:ring-2 focus:ring-emerald-100" value={selectedPatient?.pname || ''} onChange={e => setSelectedPatient({...selectedPatient, pname: e.target.value})} />
                                                    <input type="text" placeholder="ชื่อ" className="col-span-2 p-3 rounded-2xl border border-slate-200 text-sm font-black bg-white outline-none focus:ring-2 focus:ring-emerald-100" value={selectedPatient?.fname || ''} onChange={e => setSelectedPatient({...selectedPatient, fname: e.target.value})} />
                                                </div>
                                                <input type="text" placeholder="นามสกุล" className="w-full p-3 rounded-2xl border border-slate-200 text-sm font-black bg-white outline-none focus:ring-2 focus:ring-emerald-100" value={selectedPatient?.lname || ''} onChange={e => setSelectedPatient({...selectedPatient, lname: e.target.value})} />
                                            </div>
                                        )}
                                        
                                        <div className="space-y-3 mb-2">
                                            <div className="flex flex-col gap-1">
                                                <label className="text-[10px] font-black text-slate-400 uppercase ml-2 tracking-tighter">วันที่รับบริการ (Visit Date)</label>

                                                </div>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="flex flex-col gap-1">

                                                </div>
                                                <div className="flex flex-col gap-1">

                                                        <option value="">-- เลือกสิทธิ --</option>{PRIVILEGES.map(p => <option key={p} value={p}>{p}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* Treatment Plan Card */}
                                    <div className="bg-white p-5 rounded-[2.5rem] border border-slate-200 shadow-sm space-y-4 transition-all hover:shadow-md">
                                        <h2 className="text-xs text-emerald-700 uppercase tracking-widest font-black">TREATMENT PLAN</h2>
                                        <div className="grid grid-cols-2 gap-3">
                                            <select className="p-3.5 border border-slate-200 rounded-2xl text-xs bg-white font-bold outline-none shadow-sm focus:ring-2 focus:ring-emerald-100" value={appointment.woundType} onChange={e => setAppointment({...appointment, woundType: e.target.value})}><option value="">-- แผล --</option>{WOUND_TYPES.map(t => <option key={t} value={t}>{t}</option>)}</select>
