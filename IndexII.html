<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบใบนัดโรงพยาบาลเจาะไอร้อง (Firebase Edition)</title>
    
    <!-- React 18 & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (Compat 10.8.0) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- PapaParse for fast client-side CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- QRCode.js library for offline/client-side QR code generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .logo-bw {
            filter: grayscale(100%) contrast(160%) brightness(80%);
            -webkit-filter: grayscale(100%) contrast(160%) brightness(80%);
        }
        
        /* ตั้งค่าสำหรับการพิมพ์ A6 ให้พอดี 1 หน้าพอดี ไม่ขาดขอบล่าง */
        @media print {
            html, body {
                width: 105mm !important;
                height: 148mm !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            .print\:hidden { 
                display: none !important; 
                visibility: hidden !important; 
                height: 0 !important; 
                overflow: hidden !important; 
            }
            @page { 
                size: 105mm 148mm portrait; 
                margin: 0mm; 
            }
            .print-area { 
                width: 105mm !important; 
                height: 143mm !important; 
                max-height: 143mm !important; 
                border: none !important; 
                padding: 2.5mm 4mm 5.5mm 4mm !important; 
                margin: 0 !important; 
                box-sizing: border-box !important; 
                box-shadow: none !important; 
                position: relative !important; 
                top: 0 !important;
                left: 0 !important; 
                visibility: visible !important; 
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                color: #000000 !important;
                background: white !important;
                page-break-after: avoid !important;
                break-after: avoid !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                overflow: hidden !important;
            }
            img.header-logo { max-height: 46px !important; height: 42px !important; }
            .watermark { opacity: 0.18 !important; }
            .print-area * {
                color: #000000 !important;
                border-color: #000000 !important;
            }
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        @media screen {
            .print-area {
                width: 105mm;
                height: 148mm;
                max-height: 148mm;
                padding: 2.5mm 4mm 5.5mm 4mm;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const WOUND_TYPES = [
            "Laceration (แผลฉีกขาด)", "Abrasion (แผลถลอก)", "I&D (กรีดระบายหนอง)", 
            "Puncture (แผลถูกแทง)", "Avulsion (แผลถูกกระชาก)", "Excision (การตัดเนื้อออก)",
            "Cellulitis", "Amputate", "สัตว์กัด (Animal bite)", "สัตว์ข่วน (Animal scratch)", 
            "Burn", "ถอดเล็บ (Nail extraction)", "แผลเบาหวาน (DM Ulcer)", "แผลผ่าตัด (Surgical wound)", 
            "Debridement", "Aspirate"
        ];
        
        const BODY_LOCATIONS = [
            "Head (ศีรษะ)", "Face (ใบหน้า)", "Eye (ดวงตา)", "Ear (หู)", "Nose (จมูก)", "Mouth (ปาก)", 
            "Neck (คอ)", "Shoulder (ไหล่)", "Chest (หน้าอก)", "Back (หลัง)", "Abdomen (หน้าท้อง)", 
            "Arm (แขน)", "Hand (มือ)", "Finger (นิ้วมือ)", "Leg (ขา)", "Knee (เข่า)", "Foot (เท้า)", "Toe (นิ้วเท้า)",
            "Bottom (ก้น)", "Penis (องคชาต)", "Breast (หน้าอก/เต้านม)", "Vagina (ช่องคลอด)", "Scrotum (ถุงอัณฑะ)"
        ];
        
        const PRIVILEGES = [
            "บัตรทอง (UC)", "ประกันสังคม (SSS)", "พรบ. (Motor Act)", 
            "ข้าราชการ (CSMBS)", "อปท.", "รัฐวิสาหกิจ", "ประกันชีวิต/บริษัท", 
            "เงินสด (Cash)", "อื่นๆ"
        ];

        const DRAFT_KEY = 'woundcare_draft_v2_firebase';
        const FIREBASE_CONFIG_KEY = 'woundcare_firebase_config_v2';
        const PORTAL_URL_KEY = 'woundcare_portal_url_v2';
        const QR_MODE_KEY = 'woundcare_qr_mode_v2';
        const STAFF_PASSWORD = 'EMS1669';
        const STAFF_AUTH_KEY = 'woundcare_staff_auth_session';

        // Firebase Configuration
        const DEFAULT_FIREBASE_CONFIG = {
            apiKey: "AIzaSyBuhfEu9UO9QFtSELoPuG5V2vbULOCggOM",
            authDomain: "wound-care-appointment.firebaseapp.com",
            databaseURL: "https://wound-care-appointment-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "wound-care-appointment",
            storageBucket: "wound-care-appointment.firebasestorage.app",
            messagingSenderId: "728038304492",
            appId: "1:728038304492:web:9662b3d6bfeab6ed3e13c9",
            measurementId: "G-EMY6R7Q84C"
        };

        const addDays = (dateStr, n) => {
            if (!dateStr || !dateStr.includes('-')) return dateStr;
            const [y, m, d] = dateStr.split('-').map(Number);
            const res = new Date(y, m - 1, d);
            res.setDate(res.getDate() + n);
            return `${res.getFullYear()}-${String(res.getMonth()+1).padStart(2,'0')}-${String(res.getDate()).padStart(2,'0')}`;
        };

        const addMonths = (dateStr, n) => {
            if (!dateStr || !dateStr.includes('-')) return dateStr;
            const [y, m, d] = dateStr.split('-').map(Number);
            
            const targetMonthDate = new Date(y, (m - 1) + n, 1);
            const targetYear = targetMonthDate.getFullYear();
            const targetMonth = targetMonthDate.getMonth();
            
            const maxDaysInTargetMonth = new Date(targetYear, targetMonth + 1, 0).getDate();
            const actualDay = Math.min(d, maxDaysInTargetMonth);
            const finalDate = new Date(targetYear, targetMonth, actualDay);
            
            return `${finalDate.getFullYear()}-${String(finalDate.getMonth()+1).padStart(2,'0')}-${String(finalDate.getDate()).padStart(2,'0')}`;
        };

        const formatThaiDate = (dateStr, opts) => {
            if (!dateStr || typeof dateStr !== 'string' || !dateStr.includes('-')) return '-';
            const parts = dateStr.split('-').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) return '-';
            const [y, m, d] = parts;
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString('th-TH', opts);
        };

        const calculateAge = (birthday) => {
            if (!birthday || birthday === '-' || typeof birthday !== 'string') return '';
            let birthDate;
            
            if (birthday.includes('/')) {
                const parts = birthday.split('/');
                if (parts.length === 3) {
                    let year = parseInt(parts[2], 10);
                    if (year > 2400) year -= 543;
                    birthDate = new Date(year, parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
                }
            } else if (birthday.includes('-')) {
                const parts = birthday.split('-');
                if (parts.length === 3) {
                    let year = parseInt(parts[0], 10);
                    if (year > 2400) year -= 543;
                    birthDate = new Date(year, parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                }
            } else {
                birthDate = new Date(birthday);
            }

            if (!birthDate || isNaN(birthDate.getTime())) return '';

            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age >= 0 ? age : '';
        };

        const validateAppointment = (patient, appt) => {
            const errors = [];
            if (!patient) {
                errors.push('กรุณาระบุข้อมูลหรือค้นหาคนไข้');
                return errors;
            }
            if (!patient.hn || String(patient.hn).trim() === '') errors.push('HN ไม่ถูกต้อง');
            if (!patient.fname || String(patient.fname).trim() === '') errors.push('กรุณากรอกชื่อคนไข้');

            if (appt.weight !== '') {
                const w = parseFloat(appt.weight);
                if (isNaN(w) || w <= 0 || w > 300) errors.push('น้ำหนักต้องอยู่ระหว่าง 1–300 กก.');
            }

            if (appt.stitchCount !== '') {
                const s = parseInt(appt.stitchCount);
                if (isNaN(s) || s < 0 || s > 200) errors.push('จำนวนเข็มต้องอยู่ระหว่าง 0–200');
            }

            if (appt.stitchRemovalDate && appt.stitchRemovalDate <= appt.visitDate) {
                errors.push('วันนัดตัดไหมต้องหลังวันรับบริการ');
            }

            return errors;
        };

        const safeStr = (val) => (val === null || val === undefined) ? '' : String(val);

        const defaultAppointment = {
            visitDate: new Date().toLocaleDateString('en-CA'),
            weight: '', privilege: '', woundType: '', woundLocation: '',
            stitchCount: '', dressingFrequency: 'ทุกวัน', stitchRemovalDate: '',
            note: '',
            staffName: 'เจ้าหน้าที่พยาบาล', calculatedDates: []
        };

        const ValidationErrors = ({ errors, onDismiss }) => {
            if (!errors || errors.length === 0) return null;
            return (
                <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[200] bg-rose-50 border-2 border-rose-400 rounded-3xl shadow-2xl px-6 py-4 max-w-sm w-[90vw] animate-in slide-in-from-top-4">
                    <div className="flex justify-between items-start gap-3">
                        <div>
                            <div className="font-black text-rose-700 text-sm mb-2 uppercase tracking-wide">กรุณาตรวจสอบข้อมูล</div>
                            <ul className="space-y-1">
                                {errors.map((e, i) => (
                                    <li key={i} className="text-rose-600 text-xs font-bold flex items-start gap-1.5">
                                        <span className="mt-0.5">•</span>{e}
                                    </li>
                                ))}
                            </ul>
                        </div>
                        <button onClick={onDismiss} className="text-rose-400 font-black text-lg leading-none hover:text-rose-600 shrink-0">✕</button>
                    </div>
                </div>
            );
        };

        // Helper to generate iCalendar (.ics) with all appointment events
        const generateAllIcsCalendar = (events, patientName, patientHn) => {
            let ics = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Choairong Hospital//Appointment System//TH',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
                'X-WR-CALNAME:ใบนัด รพ.เจาะไอร้อง'
            ];

            events.forEach((ev) => {
                const cleanDate = ev.date.replace(/-/g, '');
                const uid = `appt-${cleanDate}-${Math.random().toString(36).substr(2, 7)}@choairong`;
                // 08:30 - 16:00 local time (UTC+7 -> 01:30 - 09:00 UTC)
                const dtStart = `${cleanDate}T013000Z`;
                const dtEnd = `${cleanDate}T090000Z`;
                
                ics.push(
                    'BEGIN:VEVENT',
                    `UID:${uid}`,
                    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
                    `DTSTART:${dtStart}`,
                    `DTEND:${dtEnd}`,
                    `SUMMARY:${ev.title} รพ.เจาะไอร้อง (${patientName || 'HN:' + patientHn})`,
                    `DESCRIPTION:${ev.title}\\nผู้ป่วย: ${patientName} (HN: ${patientHn})\\nสถานที่: โรงพยาบาลเจาะไอร้อง\\n* กรุณานำใบนัดมาด้วยทุกครั้ง`,
                    `LOCATION:โรงพยาบาลเจาะไอร้อง จ.นราธิวาส`,
                    'BEGIN:VALARM',
                    'TRIGGER:-PT12H',
                    'ACTION:DISPLAY',
                    `DESCRIPTION:เตือนความจำ: พรุ่งนี้มี${ev.title} รพ.เจาะไอร้อง`,
                    'END:VALARM',
                    'END:VEVENT'
                );
            });

            ics.push('END:VCALENDAR');
            const blob = new Blob([ics.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `ใบนัด_รพ.เจาะไอร้อง_${patientHn || 'patient'}.ics`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // Patient Mobile Portal Component (Displayed when patient scans QR code on their phone)
        const PatientPortalView = ({ data }) => {
            const patient = {
                pname: data.pname || '',
                fname: data.fname || '',
                lname: data.lname || '',
                hn: data.hn || '-'
            };
            const patientName = `${patient.pname}${patient.fname} ${patient.lname}`.trim() || 'ผู้ป่วย';

            // Collect all upcoming appointment dates
            const allEvents = [];

            if (data.stitchRemovalDate) {
                allEvents.push({
                    id: 'stitch',
                    title: 'นัดตัดไหม (Stitches Off)',
                    badge: '✂️ ตัดไหม',
                    badgeColor: 'bg-amber-100 text-amber-800 border-amber-300',
                    date: data.stitchRemovalDate,
                    time: '08:30 - 16:00 น.',
                    location: 'ห้องฉุกเฉิน / ห้องทำแผล รพ.เจาะไอร้อง'
                });
            }

            if (data.calculatedDates && Array.isArray(data.calculatedDates)) {
                data.calculatedDates.forEach((d, idx) => {
                    allEvents.push({
                        id: `vac-${idx}`,
                        title: `${d.category === 'dT' ? 'วัคซีนบาดทะยัก' : 'วัคซีนพิษสุนัขบ้า'} : ${d.label}`,
                        badge: `💉 ${d.label}`,
                        badgeColor: 'bg-blue-100 text-blue-800 border-blue-300',
                        date: d.date,
                        time: '08:30 - 16:00 น.',
                        location: 'ห้องฉุกเฉิน / ห้องฉีดยา รพ.เจาะไอร้อง'
                    });
                });
            }

            // Sort chronologically
            allEvents.sort((a, b) => (a.date > b.date ? 1 : -1));

            const openSingleGoogleCalendar = (ev) => {
                const cleanDate = ev.date.replace(/-/g, '');
                const dateParam = `${cleanDate}T083000/${cleanDate}T160000`;
                const title = `${ev.title} รพ.เจาะไอร้อง (${patientName} HN:${patient.hn})`;
                const details = `ใบนัด รพ.เจาะไอร้อง\\nผู้ป่วย: ${patientName} (HN: ${patient.hn})\\nรายการ: ${ev.title}\\n* กรุณานำใบนัดมาด้วยทุกครั้ง`;
                const location = 'โรงพยาบาลเจาะไอร้อง จ.นราธิวาส';
                const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dateParam}&location=${encodeURIComponent(location)}&details=${encodeURIComponent(details)}`;
                window.open(url, '_blank');
            };

            return (
                <div className="min-h-screen bg-slate-100 p-3 sm:p-6 text-slate-800 font-sans">
                    <div className="max-w-md mx-auto space-y-3">
                        {/* Header */}
                        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 text-center space-y-1">
                            <img src="https://img2.pic.in.th/1245bce0a0bc0e53aa53.png" alt="Hospital Logo" className="h-12 mx-auto object-contain" />
                            <h1 className="text-base font-black text-slate-900 mt-1">ใบนัดรับบริการทางการแพทย์ (ดิจิทัล)</h1>
                            <div className="text-xs font-bold text-slate-500">โรงพยาบาลเจาะไอร้อง จ.นราธิวาส</div>
                        </div>

                        {/* Patient Info Card */}
                        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2">
                            <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                <div>
                                    <div className="text-[10px] font-black text-slate-400 uppercase">ชื่อผู้ป่วย</div>
                                    <div className="text-sm font-black text-slate-900">{patientName}</div>
                                </div>
                                <div className="text-right">
                                    <div className="text-[10px] font-black text-slate-400 uppercase">HN</div>
                                    <div className="text-sm font-mono font-black text-blue-600">{patient.hn}</div>
                                </div>
                            </div>
                            {data.woundType && (
                                <div className="text-xs text-slate-600 space-y-0.5">
                                    <div><strong>แผล:</strong> {data.woundType} ({data.woundLocation || '-'})</div>
                                    <div><strong>การทำแผล:</strong> <span className="font-bold text-emerald-700">{data.dressingFrequency || '-'}</span> {data.stitchCount ? `(เย็บ ${data.stitchCount} เข็ม)` : ''}</div>
                                </div>
                            )}
                        </div>

                        {/* 1-Click Action: Add All to Calendar */}
                        {allEvents.length > 0 && (
                            <button 
                                onClick={() => generateAllIcsCalendar(allEvents, patientName, patient.hn)}
                                className="w-full bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-3.5 rounded-2xl shadow-lg shadow-emerald-600/20 font-black text-xs sm:text-sm flex items-center justify-center gap-2 active:scale-95 transition-all"
                            >
                                <span className="text-lg">⭐</span>
                                <div className="text-left leading-tight">
                                    <div>บันทึกทุกวันนัดลงปฏิทินมือถือ (1 คลิก)</div>
                                    <div className="text-[10px] text-emerald-100 font-normal">ลงปฏิทินครบทุกเข็มและวันตัดไหมพร้อมกันทันที</div>
                                </div>
                            </button>
                        )}

                        {/* Timeline list of all appointment dates */}
                        <div className="space-y-2">
                            <div className="text-xs font-black text-slate-500 uppercase px-1 flex justify-between items-center">
                                <span>ตารางนัดหมายทั้งหมด ({allEvents.length} รายการ)</span>
                                <span className="text-[10px] text-slate-400 font-normal">กดบันทึกแยกรายเข็มได้</span>
                            </div>

                            {allEvents.map((ev, index) => (
                                <div key={ev.id || index} className="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-2.5">
                                    <div className="flex justify-between items-start gap-2">
                                        <div>
                                            <span className={`inline-block text-[10px] font-black px-2 py-0.5 rounded-full border mb-1 ${ev.badgeColor}`}>
                                                {ev.badge}
                                            </span>
                                            <div className="text-sm font-black text-slate-900 leading-tight">
                                                {formatThaiDate(ev.date, { day: 'numeric', month: 'long', year: 'numeric' })}
                                            </div>
                                            <div className="text-xs text-slate-500 font-bold mt-0.5">
                                                ⏰ เวลา {ev.time}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="pt-2 border-t border-slate-100 flex justify-between items-center">
                                        <div className="text-[10px] text-slate-400 font-medium">
                                            📍 {ev.location}
                                        </div>
                                        <button 
                                            onClick={() => openSingleGoogleCalendar(ev)}
                                            className="bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 px-3 py-1.5 rounded-xl font-black text-[11px] flex items-center gap-1 active:scale-95 transition-all shrink-0"
                                        >
                                            <span>📅</span> บันทึกเข็มนี้
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Footer Notes */}
                        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-center space-y-1">
                            <div className="text-xs font-black text-amber-900">"ทำแผลนอกเวลาราชการ มีค่าบริการนอกเวลา 50 บาท"</div>
                            <div className="text-[10px] text-amber-800 font-bold">* กรุณานำบัตรประชาชนและใบนัดมาด้วยทุกครั้ง</div>
                            <div className="text-[10px] text-rose-700 font-black">เจ็บป่วยฉุกเฉินโทร 1669 ตลอด 24 ชม.</div>
                        </div>

                        <div className="text-center pt-2 pb-6">
                            <a href={window.location.origin + window.location.pathname} className="text-xs text-slate-400 font-bold underline">
                                เปิดระบบเจ้าหน้าที่ (Staff Login)
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        // Instant-Scan High Precision QR Code Component
        const GoogleCalendarQR = ({ appt, patient, isWoundCareOnly, isDenseMode, portalUrl, qrMode }) => {
            let targetDate = null;
            let eventType = '';

            if (appt.stitchRemovalDate) {
                targetDate = appt.stitchRemovalDate;
                eventType = 'นัดตัดไหม';
            } else if (appt.calculatedDates && appt.calculatedDates.length > 0) {
                const futureDoses = appt.calculatedDates.filter(d => d.date && d.date !== appt.visitDate);
                const targetDose = futureDoses.length > 0 ? futureDoses[0] : appt.calculatedDates[0];
                targetDate = targetDose ? targetDose.date : null;
                eventType = targetDose ? `${targetDose.label}` : 'นัดฉีดวัคซีน';
            }

            if (!targetDate && (!appt.calculatedDates || appt.calculatedDates.length === 0)) return null;

            const patientHn = patient ? safeStr(patient.hn) : '';
            const patientName = patient ? `${safeStr(patient.pname)}${safeStr(patient.fname)} ${safeStr(patient.lname)}`.trim() : '';
            
            // Determine Effective Base URL for Portal
            let effectivePortalUrl = portalUrl || '';
            if (!effectivePortalUrl && window.location.protocol.startsWith('http')) {
                effectivePortalUrl = window.location.origin + window.location.pathname;
            }

            let rawTargetUrl = '';
            const isPortal = Boolean(effectivePortalUrl && (qrMode === 'portal' || !qrMode));

            if (isPortal) {
                // ULTRA-COMPACT URL (<60 chars -> Version 2 chunky QR)
                const queryParams = new URLSearchParams();
                if (patientHn) queryParams.set('h', patientHn);
                if (patientName) queryParams.set('n', patientName);
                if (appt.stitchRemovalDate) queryParams.set('s', appt.stitchRemovalDate);
                const vList = (appt.calculatedDates || []).map(d => `${d.label.replace(/\s+/g, '')}:${d.date}`).join(',');
                if (vList) queryParams.set('v', vList);

                const separator = effectivePortalUrl.includes('?') ? '&' : '?';
                rawTargetUrl = `${effectivePortalUrl}${separator}${queryParams.toString()}`;
            } else {
                // SUPER LIGHTWEIGHT Direct Google Calendar URL (<120 chars -> Version 3 chunky QR)
                const cleanDate = targetDate ? targetDate.replace(/-/g, '') : '';
                const dateParam = `${cleanDate}T083000/${cleanDate}T160000`;
                const title = `นัด ${eventType || 'รพ.เจาะไอร้อง'} (${patientHn || '-'})`;
                const details = `HN: ${patientHn} ${patientName} รพ.เจาะไอร้อง`;

                rawTargetUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dateParam}&location=${encodeURIComponent('รพ.เจาะไอร้อง')}&details=${encodeURIComponent(details)}`;
            }

            const qrSizePx = isWoundCareOnly ? 88 : (isDenseMode ? 64 : 76);
            const primaryQrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=3&ecc=L&data=${encodeURIComponent(rawTargetUrl)}`;
            const backupQrUrl = `https://quickchart.io/qr?size=280&margin=3&ecLevel=L&text=${encodeURIComponent(rawTargetUrl)}`;

            return (
                <div className="flex flex-col items-center justify-center p-1 bg-white border border-black rounded-[6px] shadow-sm shrink-0">
                    <div className="bg-white p-0.5 rounded flex items-center justify-center overflow-hidden" style={{ width: `${qrSizePx}px`, height: `${qrSizePx}px` }}>
                        <img 
                            src={primaryQrUrl} 
                            alt="Calendar QR" 
                            style={{ width: `${qrSizePx}px`, height: `${qrSizePx}px` }} 
                            className="object-contain block"
                            onError={(e) => { e.target.src = backupQrUrl; }}
                        />
                    </div>
                    <div className="text-[7.5px] font-black uppercase text-center mt-0.5 tracking-tight leading-none text-black whitespace-nowrap">
                        {isPortal ? '📱 ใบนัดดิจิทัล' : '📅 สแกนลงปฏิทิน'}
                    </div>
                </div>
            );
        };

        const AppointmentCard = ({ patient, appt, portalUrl, qrMode }) => {
            const vaccines = appt.calculatedDates ? [...new Set(appt.calculatedDates.map(d => d.category))] : [];
            const isWoundCareOnly = vaccines.length === 0;
            const hasFutureAppointment = Boolean(appt.stitchRemovalDate || (appt.calculatedDates && appt.calculatedDates.length > 0));
            
            const totalDoses = appt.calculatedDates ? appt.calculatedDates.length : 0;
            const hasMultipleVaccines = vaccines.length > 1;
            const isDenseMode = (totalDoses >= 5 || hasMultipleVaccines || (totalDoses >= 4 && appt.stitchRemovalDate));

            const getCategoryTitle = (cat) => {
                if (cat === 'dT') return 'วัคซีนบาดทะยัก (dT)';
                if (cat === 'PCEC') return 'วัคซีนพิษสุนัขบ้า (Rabies Vaccine)';
                return `ตารางนัดฉีดวัคซีน ${cat}`;
            };

            return (
                <div className={`print-area bg-white text-black border border-slate-300 shadow-2xl print:shadow-none print:border-none print:m-0 overflow-hidden flex flex-col justify-between relative font-sans leading-tight mx-auto ${isDenseMode ? 'p-[2mm_3.5mm_2.5mm_3.5mm]' : 'p-[3.5mm_4mm]'}`}>
                    
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-[0.15] pointer-events-none watermark">
                        <img src="https://img1.pic.in.th/images/1bf299103031b07d1.png" alt="Watermark" className="w-[64mm] h-auto object-contain logo-bw" onError={(e) => e.target.style.display = 'none'} />
                    </div>

                    <div className="flex-1 flex flex-col justify-between">
                        <div>
                            {/* Header Section */}
                            <div className={`w-full flex justify-between items-center relative z-10 ${isDenseMode ? 'mb-0.5 pb-0.5 border-b border-black' : 'mb-1'}`}>
                                <div className="w-7/12 text-left pr-1 space-y-0.5">
                                    <h2 className={`${isDenseMode ? 'text-[11px]' : 'text-[12.5px]'} font-black uppercase leading-none tracking-tighter text-black`}>ใบนัดรับบริการทางการแพทย์</h2>
                                    <div className="text-[7px] text-black font-bold uppercase tracking-tight opacity-90 leading-none">Hospital Appointment Card</div>
                                    <div className="text-[7.5px] text-black font-extrabold leading-none mt-0.5">โรงพยาบาลเจาะไอร้อง จ.นราธิวาส</div>
                                </div>
                                <div className="w-5/12 flex justify-end items-center">
                                    <img src="https://img2.pic.in.th/1245bce0a0bc0e53aa53.png" alt="Hospital Logo" className={`header-logo object-contain mix-blend-multiply logo-bw ${isDenseMode ? 'max-h-[38px] h-[36px]' : 'max-h-[52px] h-[48px]'}`} onError={(e) => e.target.style.display = 'none'} />
                                </div>
                            </div>

                            {/* Patient Info Section */}
                            <div className={`${isDenseMode ? 'space-y-0 mb-0.5 text-[8.5px]' : (isWoundCareOnly ? 'space-y-0.5 mb-1.5' : 'space-y-0.5 mb-1')} relative z-10 text-black`}>
                                <div className="flex justify-between items-end border-b border-dotted border-black pb-0.5 gap-1">
                                    <div className="flex items-baseline flex-1 min-w-0">
                                        <strong className={`${isDenseMode ? 'text-[9.5px]' : 'text-[10.5px]'} shrink-0 mr-1 font-bold`}>ชื่อ-สกุล:</strong> 
                                        {patient && patient.fname ? (
                                            <div className={`${isDenseMode ? 'text-[10.5px]' : 'text-[12px]'} font-black px-0.5 uppercase tracking-tight leading-none flex-1 min-w-0 flex items-baseline`}>
                                                <span className="truncate">{`${safeStr(patient.pname)}${safeStr(patient.fname)} ${safeStr(patient.lname)}`}</span>
                                                {patient.birthday && calculateAge(patient.birthday) !== '' && (
                                                    <span className="ml-1 shrink-0 whitespace-nowrap text-[9px] font-bold">อายุ {calculateAge(patient.birthday)} ปี</span>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="text-[11px] font-black px-0.5 uppercase tracking-tight leading-none truncate flex-1 min-w-0">
                                                .......................................
                                            </div>
                                        )}
                                    </div>
                                    <div className={`${isDenseMode ? 'text-[9.5px]' : 'text-[10.5px]'} shrink-0 font-bold whitespace-nowrap`}>
                                        <strong>HN:</strong> <span className={`${isDenseMode ? 'text-[11.5px]' : 'text-[13px]'} font-black ml-0.5 font-mono`}>{patient && patient.hn ? safeStr(patient.hn) : '.......'}</span>
                                    </div>
                                </div>
                                
                                <div className="flex justify-between items-end border-b border-dotted border-black pb-0.5 gap-1">
                                    <div className="flex items-baseline flex-1 min-w-0">
                                        <strong className={`${isDenseMode ? 'text-[9.5px]' : 'text-[10.5px]'} shrink-0 mr-1 font-bold`}>สิทธิ:</strong> 
                                        <div className={`${isDenseMode ? 'text-[10.5px]' : 'text-[12px]'} font-black px-0.5 uppercase tracking-tight leading-none truncate`}>
                                            {appt.privilege ? safeStr(appt.privilege) : '.......................................'}
                                        </div>
                                    </div>
                                    <div className={`${isDenseMode ? 'text-[9.5px]' : 'text-[10.5px]'} shrink-0 font-bold whitespace-nowrap`}>
                                        <strong>นน.:</strong> <span className={`${isDenseMode ? 'text-[11.5px]' : 'text-[13px]'} font-black mx-0.5`}>{appt.weight ? safeStr(appt.weight) : '...'}</span> กก.
                                    </div>
                                </div>

                                <div className="flex justify-between pt-0.5 text-[7.5px] font-medium text-black">
                                    <div><strong className="font-bold">วันที่รับบริการ:</strong> {formatThaiDate(appt.visitDate, {day:'numeric', month: isDenseMode ? 'short' : 'long', year:'numeric'})}</div>
                                    <div><strong className="font-bold">เวลาพิมพ์:</strong> {new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.</div>
                                </div>
                            </div>

                            {/* แผนการรักษา (Wound Care) */}
                            {isWoundCareOnly ? (
                                <div className="mb-1.5 mt-0.5 border-[1.2px] border-black rounded-lg p-1.5 bg-white relative z-10 text-black">
                                    <div className="flex items-center justify-between border-b border-black pb-0.5 mb-1">
                                        <div className="text-[10.5px] font-black uppercase tracking-wider flex items-center gap-1.5 text-black">
                                            <span className="w-1.5 h-1.5 rounded-full bg-black inline-block"></span>
                                            แผนการรักษา (Wound Care Plan)
                                        </div>
                                        <div className="text-[9px] font-black text-black border border-black px-1.5 py-0.5 rounded-full bg-gray-50">
                                            {appt.stitchCount ? `เย็บ ${appt.stitchCount} เข็ม` : 'ไม่ได้เย็บแผล'}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-1.5">
                                        <div className="bg-gray-50 border border-black/70 rounded-md p-1.5 space-y-0.5">
                                            <div className="text-[8.5px] font-bold uppercase text-gray-700 tracking-tight">ลักษณะ & ตำแหน่งบาดแผล</div>
                                            <div className="text-[12px] font-black leading-tight text-black">
                                                {appt.woundType ? safeStr(appt.woundType.split(' ')[0]) : '-'}
                                            </div>
                                            <div className="text-[10px] font-bold text-gray-800">
                                                ตำแหน่ง: <span className="font-black text-black">{appt.woundLocation ? safeStr(appt.woundLocation) : '-'}</span>
                                            </div>
                                        </div>

                                        <div className="bg-gray-50 border border-black/70 rounded-md p-1.5 space-y-0.5 flex flex-col justify-between">
                                            <div>
                                                <div className="text-[8.5px] font-bold uppercase text-gray-700 tracking-tight">ความถี่การล้างทำแผล</div>
                                                <div className="text-[13px] font-black text-black mt-0.5">
                                                    <span className="underline decoration-2 underline-offset-2">{safeStr(appt.dressingFrequency)}</span>
                                                </div>
                                            </div>
                                            <div className="text-[7.5px] font-bold text-gray-600 italic">
                                                * ระวังอย่าให้แผลเปียกน้ำ
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className={`${isDenseMode ? 'mb-0.5 p-0.5 text-[8px]' : 'mb-1 p-1 text-[8.5px]'} border border-black rounded bg-white relative z-10 text-black leading-tight`}>
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <strong>แผล:</strong> <span className="font-bold">{appt.woundType ? safeStr(appt.woundType.split(' ')[0]) : '-'}</span> ({appt.woundLocation ? safeStr(appt.woundLocation) : '-'}) {appt.stitchCount ? `| เย็บ ${appt.stitchCount} เข็ม` : ''}
                                        </div>
                                        <div>
                                            <strong>ทำแผล:</strong> <span className="font-black underline">{safeStr(appt.dressingFrequency)}</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Vaccine Tables */}
                            {vaccines.map((cat) => (
                                <div key={cat} className={`${isDenseMode ? 'mb-0.5' : 'mb-1'} relative z-10`}>
                                    <div className={`bg-gray-100 border border-black px-1.5 flex items-center gap-1 print:bg-transparent ${isDenseMode ? 'py-0' : 'py-[1px]'}`}>
                                        <span className={`${isDenseMode ? 'text-[8.5px]' : 'text-[9.5px]'} font-black uppercase tracking-wider leading-none text-black`}>{getCategoryTitle(cat)}</span>
                                    </div>
                                    <table className="w-full border-collapse border-x border-b border-black">
                                        <thead>
                                            <tr className={`bg-gray-50 border-b border-black font-black ${isDenseMode ? 'text-[7.5px]' : 'text-[8.5px]'}`}>
                                                <th className={`text-left border-r border-black text-black ${isDenseMode ? 'px-1.5 py-[1px]' : 'px-2 py-[2px]'}`}>รายการ</th>
                                                <th className={`text-center border-r border-black w-24 text-black ${isDenseMode ? 'px-1 py-[1px]' : 'px-1.5 py-[2px]'}`}>วันที่นัด</th>
                                                <th className={`text-center w-10 text-black italic ${isDenseMode ? 'px-1 py-[1px]' : 'px-1 py-[2px]'}`}>ผู้ฉีด</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {appt.calculatedDates.filter(d => d.category === cat).map((item, idx) => (
                                                <tr key={idx} className="border-b border-black last:border-b-0 leading-tight">
                                                    <td className={`border-r border-black ${isDenseMode ? 'px-1.5 py-[1.5px]' : 'px-2 py-[3px]'}`}>
                                                        <div className="flex items-center justify-between gap-1">
                                                            <span className={`${isDenseMode ? 'text-[10px]' : 'text-[11.5px]'} font-black text-black tracking-tight leading-none`}>
                                                                {safeStr(item.label)}
                                                            </span>
                                                            {item.desc && (
                                                                <span className={`${isDenseMode ? 'text-[7.5px]' : 'text-[8.5px]'} font-bold text-gray-700 shrink-0 leading-none`}>
                                                                    {safeStr(item.desc).includes('IM') ? '(IM 0.5ml)' : (safeStr(item.desc).includes('ID') ? '(ID 0.1ml)' : '')}
                                                                </span>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className={`border-r border-black font-black text-black text-center ${isDenseMode ? 'px-1 py-[1.5px] text-[10.5px]' : 'px-1.5 py-[3px] text-[12px]'} leading-none`}>
                                                        {formatThaiDate(item.date, { day: 'numeric', month: 'short', year: '2-digit' })}
                                                    </td>
                                                    <td className={`text-center text-black font-black italic ${isDenseMode ? 'px-1 py-[1.5px] text-[7px]' : 'px-1 py-[3px] text-[8px]'}`}>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            ))}

                            {/* กำหนดนัดตัดไหม คู่กับ QR Code */}
                            {appt.stitchRemovalDate ? (
                                <div className={`flex items-stretch gap-1.5 ${isDenseMode ? 'mb-0.5 mt-0.5' : (isWoundCareOnly ? 'mb-2 mt-1' : 'mb-1 mt-0.5')} relative z-10`}>
                                    <div className={`flex-1 border-[1.2px] border-black text-center rounded-[5px] bg-gray-50 print:bg-transparent shadow-sm border-dashed flex flex-col justify-center ${isDenseMode ? 'p-1' : 'p-2'}`}>
                                        <div className={`${isDenseMode ? 'text-[7.5px] mb-0' : (isWoundCareOnly ? 'text-[11px] mb-1' : 'text-[8.5px] mb-[1px]')} font-black uppercase text-black flex items-center justify-center gap-1 leading-none`}>
                                            กำหนดนัดตัดไหม (Stitches Off)
                                        </div>
                                        <div className={`${isDenseMode ? 'text-[12px]' : (isWoundCareOnly ? 'text-[17px]' : 'text-[13px]')} font-black text-black underline decoration-double underline-offset-2 tracking-tight`}>
                                            {formatThaiDate(appt.stitchRemovalDate, { day: 'numeric', month: isDenseMode ? 'short' : 'long', year: 'numeric' })}
                                        </div>
                                        <div className={`${isDenseMode ? 'text-[6.5px] mt-0' : (isWoundCareOnly ? 'text-[8.5px] mt-1' : 'text-[7px] mt-0.5')} text-gray-800 font-bold leading-tight`}>
                                            เวลา 08:30 - 16:00 น. (ห้องฉุกเฉิน/ทำแผล)
                                        </div>
                                    </div>
                                    <GoogleCalendarQR appt={appt} patient={patient} isWoundCareOnly={isWoundCareOnly} isDenseMode={isDenseMode} portalUrl={portalUrl} qrMode={qrMode} />
                                </div>
                            ) : (
                                hasFutureAppointment && (
                                    <div className={`flex items-center justify-between gap-1.5 ${isDenseMode ? 'mb-0.5 mt-0.5 p-1' : (isWoundCareOnly ? 'mb-2 mt-1 p-2' : 'mb-1 mt-0.5 p-2')} relative z-10 border border-dashed border-black rounded-[5px] bg-gray-50 print:bg-transparent`}>
                                        <div className="text-left pl-1">
                                            <div className={`${isDenseMode ? 'text-[7.5px]' : (isWoundCareOnly ? 'text-[10px]' : 'text-[8px]')} font-black uppercase text-black`}>บันทึกวันนัดลงมือถือ</div>
                                            <div className={`${isDenseMode ? 'text-[6.5px] mt-0' : (isWoundCareOnly ? 'text-[8.5px] mt-0.5' : 'text-[6.5px]')} text-gray-700 font-bold`}>สแกนเพื่อเปิดใบนัดดิจิทัลและบันทึกลงปฏิทิน</div>
                                        </div>
                                        <GoogleCalendarQR appt={appt} patient={patient} isWoundCareOnly={isWoundCareOnly} isDenseMode={isDenseMode} portalUrl={portalUrl} qrMode={qrMode} />
                                    </div>
                                )
                            )}

                            {appt.note && (
                                <div className={`${isDenseMode ? 'mb-0.5 text-[7.5px] pl-1 border-l-[1px]' : (isWoundCareOnly ? 'mb-1 mt-0.5 text-[9px] pl-1.5 border-l-2' : 'mb-0.5 mt-0.5 text-[8px] pl-1.5 border-l-[1.5px]')} relative z-10 text-black leading-tight border-black`}>
                                    <strong className="font-black">หมายเหตุ:</strong> {safeStr(appt.note)}
                                </div>
                            )}
                        </div>

                        {/* Footer Section */}
                        <div className="mt-auto flex flex-col gap-0.5 relative z-10 pt-0.5">
                            <div className="text-center py-0">
                                <div className={`${isDenseMode ? 'text-[8px]' : 'text-[9.5px]'} font-black text-black flex items-center justify-center gap-1 uppercase tracking-[0.01em] leading-none`}>"ทำแผลนอกเวลาราชการ มีค่าบริการนอกเวลา 50 บาท"</div>
                            </div>
                            <div className="flex justify-between items-end text-[7px] pt-0.5 border-t border-black opacity-100 leading-none">
                                <div className="italic font-bold leading-tight space-y-0.5 text-black">
                                    <div className="text-black font-black">* กรุณานำใบนัดใบนี้มาด้วยทุกครั้งที่เข้ารับบริการ</div>
                                    <div className="text-black font-black">* เจ็บป่วยฉุกเฉินโทร 1669 ตลอด 24 ชม.</div>
                                    <div className="text-black font-mono tracking-tighter uppercase text-[6px]">CHOAIRONG HOSPITAL | WOUNDCARE-V1</div>
                                </div>
                                <div className="text-center min-w-[70px] text-black">
                                    <div className={`font-black uppercase border-b-[1px] border-black pb-[1px] mb-[1px] ${isDenseMode ? 'text-[7.5px]' : 'text-[8.5px]'}`}>{safeStr(appt.staffName)}</div>
                                    <div className="text-[6px] font-black uppercase tracking-widest leading-none">Authorized</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            // Check if patient opened a shared appointment link via QR Code
            const portalData = useMemo(() => {
                try {
                    const params = new URLSearchParams(window.location.search);
                    
                    // Format 1: Ultra-compact query params (h/hn, n/name, s, v, w, f/freq, c/stc)
                    const h = params.get('h') || params.get('hn');
                    const s = params.get('s');
                    const v = params.get('v');
                    if (h && (s || v)) {
                        const calculatedDates = [];
                        const vParam = v || '';
                        if (vParam) {
                            vParam.split(',').forEach(item => {
                                const parts = item.split(':');
                                if (parts.length >= 2) {
                                    calculatedDates.push({
                                        label: parts[0],
                                        date: parts[1],
                                        category: parts[0].includes('dT') ? 'dT' : 'PCEC'
                                    });
                                }
                            });
                        }
                        return {
                            hn: h || '',
                            fname: params.get('n') || params.get('name') || '',
                            pname: '',
                            lname: '',
                            stitchRemovalDate: s || '',
                            woundType: params.get('w') || '',
                            dressingFrequency: params.get('f') || params.get('freq') || '',
                            stitchCount: params.get('c') || params.get('stc') || '',
                            calculatedDates
                        };
                    }

                    // Format 2: Base64 JSON payload (p or portal)
                    const rawPayload = params.get('p') || params.get('portal');
                    if (rawPayload) {
                        const jsonStr = decodeURIComponent(atob(rawPayload));
                        return JSON.parse(jsonStr);
                    }
                } catch (e) {
                    console.error('Portal decode error:', e);
                }
                return null;
            }, []);

            if (portalData) {
                return <PatientPortalView data={portalData} />;
            }

            const [mode, setMode] = useState('app'); // 'app' | 'list' | 'settings'
            const [searchHn, setSearchHn] = useState('');
            const [selectedPatient, setSelectedPatient] = useState(null);
            const [isManualEntry, setIsManualEntry] = useState(false);
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            const [validationErrors, setValidationErrors] = useState([]);

            // Staff Authentication State
            const [isStaffAuthenticated, setIsStaffAuthenticated] = useState(() => {
                try {
                    return sessionStorage.getItem(STAFF_AUTH_KEY) === 'true';
                } catch (e) {
                    return false;
                }
            });
            const [staffPasswordInput, setStaffPasswordInput] = useState('');
            const [authError, setAuthError] = useState('');
            const [showPassword, setShowPassword] = useState(false);

            // Firebase Config State
            const [firebaseConfig, setFirebaseConfig] = useState(() => {
                try {
                    const saved = localStorage.getItem(FIREBASE_CONFIG_KEY);
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return DEFAULT_FIREBASE_CONFIG;
            });
            const [dbConnected, setDbConnected] = useState(false);
            const [dbRef, setDbRef] = useState(null);

            // Digital Patient Portal & QR Code State
            const [portalBaseUrl, setPortalBaseUrl] = useState(() => {
                return localStorage.getItem(PORTAL_URL_KEY) || '';
            });
            const [qrMode, setQrMode] = useState(() => {
                return localStorage.getItem(QR_MODE_KEY) || 'portal';
            });

            // Realtime Appointments & Patient History
            const [realtimeRegistry, setRealtimeRegistry] = useState([]);
            const [patientHistory, setPatientHistory] = useState([]);
            const [showHistoryModal, setShowHistoryModal] = useState(false);

            // Filter for Registry page
            const [filterStartDate, setFilterStartDate] = useState(() => new Date().toLocaleDateString('en-CA'));
            const [filterEndDate, setFilterEndDate] = useState(() => new Date().toLocaleDateString('en-CA'));

            // CSV Upload State
            const [csvProgress, setCsvProgress] = useState({ active: false, current: 0, total: 0, percentage: 0 });
            const fileInputRef = useRef(null);

            // Schedules
            const [dtSchedule, setDtSchedule] = useState('none'); 
            const [pcecSchedule, setPcecSchedule] = useState('none');

            // Appointment Draft
            const [appointment, setAppointment] = useState(() => {
                try {
                    const saved = localStorage.getItem(DRAFT_KEY);
                    if (saved) return { ...defaultAppointment, ...JSON.parse(saved) };
                } catch (e) { console.error(e); }
                return defaultAppointment;
            });

            // Initialize Firebase App
            useEffect(() => {
                try {
                    if (!firebase.apps.length) {
                        if (firebaseConfig && (firebaseConfig.databaseURL || firebaseConfig.projectId)) {
                            firebase.initializeApp(firebaseConfig);
                        }
                    } else {
                        // Re-initialize if config changed
                        const currentApp = firebase.app();
                        if (currentApp.options.databaseURL !== firebaseConfig.databaseURL) {
                            currentApp.delete().then(() => {
                                firebase.initializeApp(firebaseConfig);
                            });
                        }
                    }

                    const db = firebase.database();
                    setDbRef(db);

                    // Connection State Monitor
                    const connectedRef = db.ref('.info/connected');
                    connectedRef.on('value', (snap) => {
                        setDbConnected(snap.val() === true);
                    });

                    // Listen to /registry in real-time
                    const registryRef = db.ref('registry');
                    registryRef.on('value', (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            const list = Object.keys(val).map(key => ({
                                id: key,
                                ...val[key]
                            }));
                            setRealtimeRegistry(list);
                        } else {
                            setRealtimeRegistry([]);
                        }
                    }, (err) => {
                        console.warn("Registry listener error:", err.message);
                    });

                    return () => {
                        connectedRef.off();
                        registryRef.off();
                    };
                } catch (err) {
                    console.error("Firebase init error:", err);
                    setDbConnected(false);
                }
            }, [firebaseConfig]);

            // Save Draft to LocalStorage
            useEffect(() => {
                try {
                    const { calculatedDates, ...rest } = appointment;
                    localStorage.setItem(DRAFT_KEY, JSON.stringify(rest));
                } catch (e) {}
            }, [appointment]);

            useEffect(() => {
                try {
                    const savedPatient = localStorage.getItem(DRAFT_KEY + '_patient');
                    if (savedPatient) {
                        const { patient: p, wasManual } = JSON.parse(savedPatient);
                        setSelectedPatient(p);
                        setIsManualEntry(wasManual === true);
                    }
                } catch (e) {}
            }, []);

            useEffect(() => {
                try {
                    if (selectedPatient) {
                        localStorage.setItem(DRAFT_KEY + '_patient', JSON.stringify({
                            patient: selectedPatient,
                            wasManual: isManualEntry 
                        }));
                        loadPatientHistory(selectedPatient.hn);
                    } else {
                        setPatientHistory([]);
                    }
                } catch (e) {}
            }, [selectedPatient, isManualEntry]);

            const showNotification = (msg, type = 'success') => {
                setToast({ show: true, message: msg, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3500);
            };

            const handleStaffLogin = (e) => {
                if (e) e.preventDefault();
                if (staffPasswordInput.trim() === STAFF_PASSWORD) {
                    try {
                        sessionStorage.setItem(STAFF_AUTH_KEY, 'true');
                    } catch (err) {}
                    setIsStaffAuthenticated(true);
                    setAuthError('');
                    setStaffPasswordInput('');
                    showNotification("เข้าสู่ระบบเจ้าหน้าที่เรียบร้อย ✓", "success");
                } else {
                    setAuthError("รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง");
                }
            };

            const handleStaffLogout = () => {
                try {
                    sessionStorage.removeItem(STAFF_AUTH_KEY);
                } catch (err) {}
                setIsStaffAuthenticated(false);
                setStaffPasswordInput('');
                setAuthError('');
                showNotification("ออกจากระบบเจ้าหน้าที่แล้ว", "info");
            };

            const clearDraft = () => {
                try {
                    localStorage.removeItem(DRAFT_KEY);
                    localStorage.removeItem(DRAFT_KEY + '_patient');
                } catch (e) {}
            };

            // Load Patient Appointment History from Firebase
            const loadPatientHistory = async (hn) => {
                if (!hn || !dbRef) return;
                try {
                    const snap = await dbRef.ref('appointments')
                        .orderByChild('patientHn')
                        .equalTo(String(hn))
                        .once('value');
                    
                    const data = snap.val();
                    if (data) {
                        const historyList = Object.keys(data).map(k => ({
                            id: k,
                            ...data[k]
                        })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                        setPatientHistory(historyList);
                    } else {
                        setPatientHistory([]);
                    }
                } catch (e) {
                    console.error("Load history error:", e);
                }
            };

            const toggleManualEntry = () => {
                const nextManualState = !isManualEntry;
                setIsManualEntry(nextManualState);
                setSelectedPatient(nextManualState ? { hn: searchHn, pname: '', fname: '', lname: '', privilege: '', cid: '', birthday: '' } : null);
            };

            // Vaccine Calculation Engine
            useEffect(() => {
                let dates = [];
                const start = appointment.visitDate;
                if (!start) return;
                
                if (pcecSchedule === 'PCEC_IM_Essen') {
                    [0, 3, 7, 14, 28].forEach((d, i) => dates.push({ label: `SPEEDA #${i + 1} (D${d})`, date: addDays(start, d), desc: 'IM (0.5 ml) แขน 1 ข้าง', status: d === 0 ? 'ฉีดแล้ว' : 'นัดหมาย', category: 'PCEC' }));
                } else if (pcecSchedule === 'PCEC_ID_TRC') {
                    [0, 3, 7, 28].forEach((d, i) => dates.push({ label: `SPEEDA #${i + 1} (D${d})`, date: addDays(start, d), desc: 'ID (0.1 ml) 2 ข้างพร้อมกัน', status: d === 0 ? 'ฉีดแล้ว' : 'นัดหมาย', category: 'PCEC' }));
                } else if (pcecSchedule === 'PCEC_booster_lt_6m_IM') {
                    dates.push({ label: 'SPEEDA Booster (D0)', date: start, desc: 'IM (0.5 ml) แขน 1 ข้าง', status: 'ฉีดแล้ว', category: 'PCEC' });
                } else if (pcecSchedule === 'PCEC_booster_lt_6m_ID') {
                    dates.push({ label: 'SPEEDA Booster (D0)', date: start, desc: 'ID (0.1 ml) 1 จุด', status: 'ฉีดแล้ว', category: 'PCEC' });
                } else if (pcecSchedule === 'PCEC_booster_gt_6m_IM') {
                    [0, 3].forEach((d, i) => dates.push({ label: `SPEEDA Booster #${i + 1} (D${d})`, date: addDays(start, d), desc: 'IM (0.5 ml) แขน 1 ข้าง', status: d === 0 ? 'ฉีดแล้ว' : 'นัดหมาย', category: 'PCEC' }));
                } else if (pcecSchedule === 'PCEC_booster_gt_6m_ID') {
                    [0, 3].forEach((d, i) => dates.push({ label: `SPEEDA Booster #${i + 1} (D${d})`, date: addDays(start, d), desc: 'ID (0.1 ml) 1 จุด', status: d === 0 ? 'ฉีดแล้ว' : 'นัดหมาย', category: 'PCEC' }));
                }

                if (dtSchedule === 'dT_new') {
                    const dose1Date = start;
                    const dose2Date = addMonths(dose1Date, 1);
                    const dose3Date = addMonths(dose2Date, 6);
                    
                    dates.push(
                        { label: 'dT เข็ม 1', date: dose1Date, desc: 'IM (0.5 ml)', status: 'ฉีดแล้ว', category: 'dT' },
                        { label: 'dT เข็ม 2 (+1ด)', date: dose2Date, desc: 'IM (0.5 ml)', status: 'นัดหมาย', category: 'dT' },
                        { label: 'dT เข็ม 3 (+6ด)', date: dose3Date, desc: 'IM (0.5 ml)', status: 'นัดหมาย', category: 'dT' }
                    );
                } else if (dtSchedule === 'dT_booster') {
                    dates.push({ label: 'dT (กระตุ้น)', date: start, desc: 'IM (0.5 ml) เข้ากล้ามเนื้อ', status: 'ฉีดแล้ว', category: 'dT' });
                }
                setAppointment(prev => ({ ...prev, calculatedDates: dates }));
            }, [appointment.visitDate, pcecSchedule, dtSchedule]);

            // Search Patient in Firebase Realtime Database
            const handleSearch = async () => {
                const trimmedHn = String(searchHn).trim();
                if (!trimmedHn) return;
                setLoading(true);

                try {
                    if (!dbRef) throw new Error("ฐานข้อมูล Firebase ยังไม่พร้อมใช้งาน");
                    
                    const snapshot = await dbRef.ref(`patients/${trimmedHn}`).once('value');
                    const found = snapshot.val();

                    if (found) {
                        setSelectedPatient(found);
                        setIsManualEntry(false);
                        loadPatientHistory(found.hn);
                        showNotification(`พบข้อมูลคนไข้: ${found.pname || ''}${found.fname} ${found.lname}`, "success");
                    } else {
                        showNotification(`ไม่พบ HN ${trimmedHn} ใน Firebase (สามารถกดกรอกข้อมูลเองได้)`, "error");
                    }
                } catch (err) {
                    console.error("Search error:", err);
                    showNotification(`ค้นหาไม่สำเร็จ: ${err.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            // Save Appointment to Firebase Realtime Database
            const handleSave = async () => {
                const errors = validateAppointment(selectedPatient, appointment);
                if (errors.length > 0) {
                    setValidationErrors(errors);
                    return;
                }

                setLoading(true);
                try {
                    if (!dbRef) throw new Error("ไม่ได้เชื่อมต่อ Firebase Realtime Database");

                    const newApptKey = dbRef.ref('appointments').push().key;
                    const timestamp = Date.now();

                    const appointmentData = {
                        id: newApptKey,
                        visitDate: appointment.visitDate,
                        patientHn: String(selectedPatient.hn),
                        patientName: `${selectedPatient.pname || ''}${selectedPatient.fname} ${selectedPatient.lname}`,
                        patientInfo: selectedPatient,
                        weight: appointment.weight,
                        privilege: appointment.privilege,
                        woundType: appointment.woundType,
                        woundLocation: appointment.woundLocation,
                        stitchCount: appointment.stitchCount,
                        dressingFrequency: appointment.dressingFrequency,
                        stitchRemovalDate: appointment.stitchRemovalDate,
                        calculatedDates: appointment.calculatedDates || [],
                        note: appointment.note,
                        staffName: appointment.staffName,
                        createdAt: timestamp,
                        createdAtFormatted: new Date().toLocaleString('th-TH')
                    };

                    const updates = {};
                    // 1. บันทึกลง /appointments/{newApptKey}
                    updates[`/appointments/${newApptKey}`] = appointmentData;

                    // 2. ถ้าคนไข้ถูกกรอกใหม่หรือยังไม่มีใน /patients ให้อัปเดตข้อมูลคนไข้
                    updates[`/patients/${String(selectedPatient.hn)}`] = {
                        hn: String(selectedPatient.hn),
                        pname: selectedPatient.pname || '',
                        fname: selectedPatient.fname || '',
                        lname: selectedPatient.lname || '',
                        cid: selectedPatient.cid || '',
                        birthday: selectedPatient.birthday || '-'
                    };

                    // 3. แตกรายการนัดหมายในอนาคตลง /registry
                    if (appointment.stitchRemovalDate) {
                        const regKey = dbRef.ref('registry').push().key;
                        updates[`/registry/${regKey}`] = {
                            id: regKey,
                            appointmentId: newApptKey,
                            hn: String(selectedPatient.hn),
                            name: `${selectedPatient.pname || ''}${selectedPatient.fname} ${selectedPatient.lname}`,
                            date: appointment.stitchRemovalDate,
                            type: 'ตัดไหม (Suture Removal)',
                            status: 'pending',
                            createdAt: timestamp
                        };
                    }

                    if (appointment.calculatedDates) {
                        appointment.calculatedDates.forEach(d => {
                            if (d.status === 'นัดหมาย') {
                                const regKey = dbRef.ref('registry').push().key;
                                updates[`/registry/${regKey}`] = {
                                    id: regKey,
                                    appointmentId: newApptKey,
                                    hn: String(selectedPatient.hn),
                                    name: `${selectedPatient.pname || ''}${selectedPatient.fname} ${selectedPatient.lname}`,
                                    date: d.date,
                                    type: `ฉีดวัคซีน: ${d.label}`,
                                    status: 'pending',
                                    createdAt: timestamp
                                };
                            }
                        });
                    }

                    // Execute Multi-path Real-time Update
                    await dbRef.ref().update(updates);

                    showNotification("บันทึกลง Firebase Realtime Database สำเร็จ ✓", "success");
                    loadPatientHistory(selectedPatient.hn);
                    clearDraft();

                } catch (err) {
                    console.error('Save error:', err);
                    showNotification(`บันทึกไม่สำเร็จ: ${err.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handlePrint = () => {
                const errors = validateAppointment(selectedPatient, appointment);
                if (errors.length > 0) {
                    setValidationErrors(errors);
                    return;
                }
                window.print();
            };

            const handleClearDraft = () => {
                clearDraft();
                setSelectedPatient(null);
                setIsManualEntry(false);
                setSearchHn('');
                setDtSchedule('none');
                setPcecSchedule('none');
                setAppointment(defaultAppointment);
                setPatientHistory([]);
                showNotification("ล้างข้อมูลเรียบร้อย พร้อมเริ่มรายการใหม่", "success");
            };

            const restoreHistoryToForm = (log) => {
                if (log.patientInfo) {
                    setSelectedPatient(log.patientInfo);
                }
                setAppointment({
                    visitDate: log.visitDate || new Date().toLocaleDateString('en-CA'),
                    weight: log.weight || '',
                    privilege: log.privilege || '',
                    woundType: log.woundType || '',
                    woundLocation: log.woundLocation || '',
                    stitchCount: log.stitchCount || '',
                    dressingFrequency: log.dressingFrequency || 'ทุกวัน',
                    stitchRemovalDate: log.stitchRemovalDate || '',
                    note: log.note || '',
                    staffName: log.staffName || 'เจ้าหน้าที่พยาบาล',
                    calculatedDates: log.calculatedDates || []
                });
                setShowHistoryModal(false);
                showNotification(`โหลดข้อมูลใบนัดวันที่ ${formatThaiDate(log.visitDate)} เรียบร้อย`, "success");
            };

            // Delete item from Registry
            const handleDeleteRegistryItem = async (id) => {
                if (!dbRef || !id) return;
                try {
                    await dbRef.ref(`registry/${id}`).remove();
                    showNotification("ลบรายการนัดหมายเรียบร้อย", "success");
                } catch (e) {
                    showNotification("ลบไม่สำเร็จ: " + e.message, "error");
                }
            };

            // Batch CSV Import Handler
            const handleCsvUpload = (event) => {
                const file = event.target.files[0];
                if (!file || !dbRef) return;

                setCsvProgress({ active: true, current: 0, total: 0, percentage: 0 });

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: async (results) => {
                        const rows = results.data;
                        const total = rows.length;
                        const batchSize = 500;
                        let processed = 0;

                        try {
                            for (let i = 0; i < total; i += batchSize) {
                                const chunk = rows.slice(i, i + batchSize);
                                const updates = {};
                                
                                chunk.forEach(row => {
                                    const hn = String(row.hn || row.HN || '').trim();
                                    if (hn) {
                                        updates[`/patients/${hn}`] = {
                                            hn: hn,
                                            pname: row.pname || '',
                                            fname: row.fname || '',
                                            lname: row.lname || '',
                                            cid: row.cid || '',
                                            birthday: row.birthday || '-'
                                        };
                                    }
                                });

                                await dbRef.ref().update(updates);
                                processed += chunk.length;
                                const pct = Math.min(100, Math.round((processed / total) * 100));
                                setCsvProgress({ active: true, current: processed, total, percentage: pct });
                            }

                            showNotification(`นำเข้าข้อมูลผู้ป่วยสำเร็จ ${processed} รายการ`, "success");
                        } catch (err) {
                            console.error("CSV Import error:", err);
                            showNotification(`การนำเข้าข้อมูลล้มเหลว: ${err.message}`, "error");
                        } finally {
                            setTimeout(() => {
                                setCsvProgress({ active: false, current: 0, total: 0, percentage: 0 });
                                if (fileInputRef.current) fileInputRef.current.value = '';
                            }, 1500);
                        }
                    },
                    error: (error) => {
                        showNotification(`อ่านไฟล์ CSV ไม่สำเร็จ: ${error.message}`, "error");
                        setCsvProgress({ active: false, current: 0, total: 0, percentage: 0 });
                    }
                });
            };

            const handleSaveSettings = () => {
                try {
                    localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(firebaseConfig));
                    localStorage.setItem(PORTAL_URL_KEY, portalBaseUrl);
                    localStorage.setItem(QR_MODE_KEY, qrMode);
                    showNotification("บันทึกการตั้งค่าทั้งหมดเรียบร้อย ✓", "success");
                    setMode('app');
                } catch (e) {
                    showNotification("บันทึกไม่สำเร็จ", "error");
                }
            };

            if (!isStaffAuthenticated) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 flex flex-col justify-center items-center p-4 font-['Sarabun'] relative overflow-hidden">
                        {/* Background Decorative Circles */}
                        <div className="absolute -top-32 -left-32 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

                        <div className="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl p-8 shadow-2xl border border-white/20 relative z-10 animate-in fade-in zoom-in-95 duration-300">
                            {/* Hospital Header Icon */}
                            <div className="text-center mb-6">
                                <div className="w-20 h-20 bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-3xl mx-auto flex items-center justify-center text-white shadow-xl shadow-emerald-600/30 mb-4 transform hover:scale-105 transition-transform duration-300">
                                    <span className="text-4xl">🏥</span>
                                </div>
                                <h2 className="text-2xl font-black text-slate-800 tracking-tight">ระบบใบนัดโรงพยาบาล</h2>
                                <p className="text-xs font-bold text-emerald-700 uppercase tracking-widest mt-1">โรงพยาบาลเจาะไอร้อง (Choairong Hospital)</p>
                                <div className="inline-flex items-center gap-1.5 mt-3 px-3.5 py-1.5 bg-slate-100 rounded-full text-slate-600 text-[11px] font-bold">
                                    <span>🔒</span> สำหรับเจ้าหน้าที่ทางการแพทย์เท่านั้น
                                </div>
                            </div>

                            {/* Login Form */}
                            <form onSubmit={handleStaffLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-black text-slate-700 uppercase tracking-wider mb-2">
                                        รหัสผ่านเข้าใช้งาน (Staff Password)
                                    </label>
